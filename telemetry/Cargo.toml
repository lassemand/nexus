[package]
name = "telemetry"
version.workspace = true
edition = "2021"

[dependencies]
anyhow = "1"
backon = { version = "1.6", default-features = false, features = ["std", "tokio-sleep"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util"] }
tracing = "0.1"
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "ansi", "json", "env-filter", "registry", "tracing-log"] }
serde_json = "1"
rdkafka = { version = "0.36", features = ["cmake-build", "tokio"], optional = true }

[features]
kafka = ["dep:rdkafka"]

[dev-dependencies]
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "testing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
anyhow = "1"
metrics = "0.24"
