name: Release conductor image

# Separate from `release.yml` on purpose. That workflow triggers on `v*` and
# the app ApplicationSet auto-deploys every nexus release; each deploy restarts
# the pod and interrupts whatever agent session is running. Conductor should
# restart only when conductor changes, so it gets its own tag stream.
#
# `conductor-v*` and `v*` cannot both match a tag: `v*` is anchored at the
# start, and `conductor-v1.2.3` begins with "c".

on:
  push:
    tags:
      - 'conductor-v*'

jobs:
  docker:
    name: Build and push conductor image
    runs-on: ubuntu-24.04-arm
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        id: version
        run: |
          # conductor-v1.2.3 -> 1.2.3
          echo "version=${GITHUB_REF_NAME#conductor-v}" >> "$GITHUB_OUTPUT"

      - name: Read pinned Claude Code version
        id: claude
        run: |
          # Single source of truth is the Dockerfile's default, so a local
          # build and a released build pin the same CLI.
          version="$(sed -n 's/^ARG CLAUDE_CODE_VERSION=\(.*\)$/\1/p' infra/Dockerfile.conductor | head -1)"
          if [[ -z "$version" ]]; then
            echo "could not read CLAUDE_CODE_VERSION from infra/Dockerfile.conductor" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Pinning Claude Code ${version}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/arm64

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile.conductor
          platforms: linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            CLAUDE_CODE_VERSION=${{ steps.claude.outputs.version }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nexus-conductor:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nexus-conductor:latest
          cache-from: type=gha,scope=conductor
          cache-to: type=gha,mode=max,scope=conductor
