name: E2E Verify

on:
  pull_request:

jobs:
  smoke-test:
    name: PR smoke test (mocked APIs, ephemeral Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: chronicle
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y protobuf-compiler libssl-dev libsasl2-dev \
            libcurl4-openssl-dev cmake

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run smoke test
        env:
          TEST_DATABASE_URL: postgres://nexus:nexus@localhost:5432/chronicle
        run: cargo test -p chronicle --bin verify
