name: E2E Verify

# Runs as a smoke test on every PR, after every push to main, and on a daily
# schedule. Checks each NEX-87 acceptance criterion against the live cluster.
#
# The two checks that depend on an external third-party source
# (fi_pdmr_ingested -> FI's public API, holidays_populated's --bootstrap ->
# Nager.Date) are both designed to degrade to an advisory pass rather than
# fail the run if that source is unreachable or slow (see
# chronicle/src/verify.rs's CheckResult::warn paths, and the timeouts on
# both reqwest clients) — so a flaky/down external source cannot block a PR
# merge here, only ever downgrade that one check to "advisory" in the output.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 06:00 UTC daily — before First North opens (09:00 CEST).
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

jobs:
  verify:
    name: NEX-87 end-to-end verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y protobuf-compiler libssl-dev libsasl2-dev \
            libcurl4-openssl-dev cmake

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build verify binary
        run: cargo build --release -p chronicle --bin verify

      - name: Run e2e verification
        env:
          # Secrets configured in GitHub repo settings → Actions secrets.
          DATABASE_URL: ${{ secrets.SIGNAL_DATABASE_URL }}
          VERIFY_TICKER: GOMX
          LOOKBACK_DAYS: "90"
          # Self-heals holidays_populated only (a direct, idempotent Postgres
          # upsert) — company_registered/fi_pdmr_ingested stay read-only since
          # they depend on a separate Kafka consumer catching up, and
          # bars_flowing can never be automated (requires a manual Saxo
          # market-data subscription). See chronicle/src/verify.rs module docs.
          #
          # Only bootstraps on push/schedule/dispatch, not on pull_request —
          # a PR smoke test shouldn't be writing to the shared live database
          # on every push; that's reserved for the post-merge/scheduled run.
          VERIFY_BOOTSTRAP: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
        run: ./target/release/verify
