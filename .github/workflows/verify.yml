name: E2E Verify

# Two independent jobs, split by trigger:
#
# - smoke-test (pull_request only): runs chronicle/src/verify.rs's
#   #[cfg(test)] smoke_test module against a throwaway Postgres service
#   container and an in-process wiremock server standing in for FI's API
#   and Nager.Date. No live cluster, no GitHub secret, no external network
#   dependency at all — a flaky/down third-party source cannot affect this,
#   because nothing here talks to a third party.
#
# - live-verify (schedule/workflow_dispatch only, deliberately NOT
#   pull_request or push to main): builds and runs the real verify binary
#   against the live cluster via the SIGNAL_DATABASE_URL secret, checking
#   each NEX-87 acceptance criterion for real. This is what actually
#   exercises the live Kafka-consumer pipeline and the real FI/Nager.Date
#   APIs — deliberately kept off the PR path so its network dependencies
#   (and the DB-mutating --bootstrap self-heal) never gate a merge.
on:
  pull_request:
  schedule:
    # 06:00 UTC daily — before First North opens (09:00 CEST).
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

jobs:
  smoke-test:
    name: PR smoke test (mocked APIs, ephemeral Postgres)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: chronicle
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y protobuf-compiler libssl-dev libsasl2-dev \
            libcurl4-openssl-dev cmake

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run smoke test
        env:
          # Consumed by chronicle/src/verify.rs's smoke_test module — points
          # at the ephemeral Postgres service container above, migrated via
          # signal/migrations at test-run time (sqlx::migrate!, not the
          # initContainer path real deployments use).
          TEST_DATABASE_URL: postgres://nexus:nexus@localhost:5432/chronicle
        run: cargo test -p chronicle --bin verify

  live-verify:
    name: NEX-87 end-to-end verify (live cluster)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y protobuf-compiler libssl-dev libsasl2-dev \
            libcurl4-openssl-dev cmake

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build verify binary
        run: cargo build --release -p chronicle --bin verify

      - name: Run e2e verification
        env:
          # Secrets configured in GitHub repo settings → Actions secrets.
          DATABASE_URL: ${{ secrets.SIGNAL_DATABASE_URL }}
          VERIFY_TICKER: GOMX
          LOOKBACK_DAYS: "90"
          # Self-heals holidays_populated only (a direct, idempotent Postgres
          # upsert) — company_registered/fi_pdmr_ingested stay read-only since
          # they depend on a separate Kafka consumer catching up, and
          # bars_flowing can never be automated (requires a manual Saxo
          # market-data subscription). See chronicle/src/verify.rs module docs.
          VERIFY_BOOTSTRAP: "true"
        run: ./target/release/verify
