name: CI

# A pull request runs only the tasks its changes can affect; main and a manual
# run run every task. Selection is moon's (docs/guides/ci.md). There is no
# `paths:` filter on purpose: conductor's CI gate needs finished check runs on
# every pull request, and `ci-ok` always gives one.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # "Run workflow" on a branch runs every task, for a full run of a PR's head.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Used by #[sqlx::test] to locate the test Postgres instance.
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
  # chronicle's integration tests (tests/common::TestDb, smoke_test) create their
  # own databases from this; without it they skip, and under CI that is a failure.
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
  # A pull request is compared with its base branch; push and manual runs run
  # everything (scripts/ci/moon-ci.sh).
  MOON_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}-base', github.head_ref) || 'origin/main' }}
  MOON_CI_ALL: ${{ github.event_name == 'push' && format('push to {0}', github.ref_name) || github.event_name == 'workflow_dispatch' && 'manual run (workflow_dispatch)' || '' }}

jobs:
  # Light: no Postgres, no system packages, no Rust cache. Learns from moon what
  # will run (scripts/ci/moon-plan.sh); when that is only fmt, runs it here
  # and the jobs below are skipped.
  plan:
    name: plan / fmt
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.plan.outputs.heavy }}
      isolation: ${{ steps.plan.outputs.isolation }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Install moon
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4

      - name: Plan
        id: plan
        run: scripts/ci/moon-plan.sh

      - name: moon ci (fmt only)
        if: steps.plan.outputs.heavy == 'false'
        run: scripts/ci/moon-ci.sh

      - name: Summary
        if: always() && steps.plan.outputs.heavy == 'false'
        run: python3 scripts/ci/moon-summary.py "moon ci (fmt only)"

      - name: Plan summary
        if: always() && steps.plan.outputs.heavy != 'false'
        run: |
          {
            echo "## plan"
            echo
            echo "- mode: ${{ steps.plan.outputs.mode }}"
            echo "- tasks beyond fmt: ${{ steps.plan.outputs.heavy }} (job \`moon ci\`)"
            echo "- review isolation: ${{ steps.plan.outputs.isolation }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # The moon setup's own checks: graph against cargo metadata, declared
  # cross-crate inputs, and the selection test (docs/guides/ci.md).
  moon-config:
    name: moon config checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install moon
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4

      - name: Project graph matches cargo metadata
        run: scripts/ci/check-moon-graph.py

      - name: Cross-crate reads are declared inputs
        run: scripts/ci/check-cross-crate-inputs.py

      - name: Affected selection
        run: bash scripts/ci/test-affected.sh

  ci:
    name: moon ci
    needs: plan
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            protobuf-compiler \
            libssl-dev \
            libsasl2-dev \
            libcurl4-openssl-dev \
            cmake \
            tmux

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      # moon runs cargo per crate, which builds dependencies in other feature
      # sets than `cargo test --all` did, so the cache has its own prefix. It is
      # saved only by main (which runs every task, so it holds every crate's
      # dependencies) and stays valid until Cargo.lock changes.
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-moon
          save-if: true

      - name: Install moon
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4

      # One task at a time: parallel cargo processes oversubscribe the runner
      # and break wall-clock tests (analyst's decision latency p99 < 10 ms);
      # cargo parallelises each build itself.
      - name: moon ci
        env:
          MOON_CONCURRENCY: '1'
        run: scripts/ci/moon-ci.sh

      - name: Summary
        if: always()
        run: python3 scripts/ci/moon-summary.py "moon ci"

  # The review session's boundary (NEX-285), with the real mechanism: the
  # uid-switch helper is built with this runner's uids, given its file
  # capabilities, and conductor/deploy/review-isolation-test.sh then starts
  # sessions through tmux as the reviewer user and checks what that user can
  # and cannot reach. No network access to GitHub or Linear is needed. Runs
  # when moon finds `conductor/deploy:isolation` affected, and on main.
  review-isolation:
    name: review session isolation
    needs: plan
    if: needs.plan.outputs.isolation == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tmux libcap2-bin jq python3

      - name: Build and install the switch and the wrappers
        run: |
          set -euxo pipefail
          reviewer_uid=2001
          sudo useradd --uid "$reviewer_uid" --no-create-home --shell /usr/sbin/nologin reviewerci
          data=/tmp/rdata
          mkdir -p "$data"
          chmod 1777 "$data"
          sudo install -d -m 0755 /usr/local/libexec
          sudo gcc -O2 -Wall -Wextra -Werror \
            -DAGENT_UID="$(id -u)" -DREVIEWER_UID="$reviewer_uid" \
            -DREVIEWER_HOME="\"$data/review/home\"" \
            -DREVIEWER_IDENTITY="\"$data/review/identity\"" \
            -DSESSION_PROGRAM="\"/usr/local/bin/conductor-review-session\"" \
            -o /usr/local/libexec/conductor-review-switch conductor/deploy/review-switch.c
          sudo chown "root:$(id -g)" /usr/local/libexec/conductor-review-switch
          sudo chmod 0750 /usr/local/libexec/conductor-review-switch
          sudo setcap cap_setuid,cap_setgid+ep /usr/local/libexec/conductor-review-switch
          getcap /usr/local/libexec/conductor-review-switch
          sudo install -m 0755 conductor/deploy/review-session.sh /usr/local/bin/conductor-review-session
          sudo install -m 0755 conductor/deploy/review-launch.sh /usr/local/bin/conductor-review-launch
          sudo install -m 0755 conductor/deploy/review-bin/* /usr/local/bin/
          echo "REVIEW_TEST_DATA=$data" >> "$GITHUB_ENV"
          echo "CONDUCTOR_REVIEW_UID=$reviewer_uid" >> "$GITHUB_ENV"

      - name: Install moon
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4

      - name: Review session isolation
        env:
          MOON_CI_IGNORE_CI_CHECKS: '1'
        run: |
          grep -E 'Cap(Bnd|Eff)|NoNewPrivs' /proc/self/status
          /usr/local/libexec/conductor-review-switch --probe || true
          scripts/ci/moon-ci.sh conductor/deploy:isolation

      - name: Summary
        if: always()
        run: python3 scripts/ci/moon-summary.py "review session isolation" conductor/deploy:isolation

  # The one result to look at (and to require, if main gets branch
  # protection): succeeds only when every job above succeeded or was skipped.
  ci-ok:
    name: ci-ok
    needs: [plan, moon-config, ci, review-isolation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {job: n["result"] for job, n in needs.items() if n["result"] not in ("success", "skipped")}
          for job, n in needs.items():
              print(job + ": " + n["result"])
          if bad:
              sys.exit(f"not passing: {bad}")
          '
