name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Used by #[sqlx::test] to locate the test Postgres instance.
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
  # chronicle's integration tests (tests/common::TestDb, smoke_test) create their
  # own databases from this; without it they skip, and under CI that is a failure.
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  ci:
    name: fmt / clippy / test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            protobuf-compiler \
            libssl-dev \
            libsasl2-dev \
            libcurl4-openssl-dev \
            cmake \
            tmux

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all

      - name: Telemetry Kafka trace context and collector-down timing
        run: |
          cargo test -p telemetry --features kafka --lib kafka::
          cargo test -p telemetry --release --lib trace::tests::collector_down_never_blocks

      - name: Verdict kernel for WASM
        run: |
          cargo clippy -p verdict-sdk -p verdict-sample -p verdict-bench-anchored -p verdict-bench-memmem -p verdict-bench-aho --target wasm32-unknown-unknown -- -D warnings
          cargo build --release --target wasm32-unknown-unknown -p verdict-sample -p verdict-bench-anchored -p verdict-bench-memmem -p verdict-bench-aho

      - name: Verdict template
        working-directory: verdict/template
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --release --target wasm32-unknown-unknown
