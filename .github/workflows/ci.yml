name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Used by #[sqlx::test] to locate the test Postgres instance.
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  ci:
    name: fmt / clippy / test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            protobuf-compiler \
            libssl-dev \
            libsasl2-dev \
            libcurl4-openssl-dev \
            cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: |
          set -euo pipefail
          # Everything but conductor runs at full width.
          cargo test --all --exclude conductor
          # conductor's integration suites are connection-hungry: each test
          # stands up a dispatcher with its own pool, and the `sessions` tests
          # additionally spawn the CLI as a child process, which opens a second
          # pool of its own against the same database. Unbounded, that walks
          # into Postgres' default 100-connection ceiling, and the symptom is
          # not an assertion but `PoolTimedOut` from sqlx's own test harness —
          # tests early in the binary pass and later ones fail in a block.
          cargo test -p conductor -- --test-threads=2
