image:
  repository: "lmapwns/nexus"
  tag: "0.7.2"
schedules:
  chronicle: "0 6 * * *"
  market: "0 22 * * 1-5"
  earnings: "0 7 * * *"
  filings: "0 6 * * 1-5"
  nordicReports: "0 22 * * *"
  nordicCalendar: "30 6 * * *"
# RUST_LOG for every chronicle workload. Needed: with tracing-subscriber's
# env-filter feature, an unset RUST_LOG means errors only.
logLevel: "info"
saxo:
  # Saxo chart API version for daily bars (SAXO_CHART_VERSION). v1 answered
  # 404 for GOMX on the live gateway (NEX-183).
  chartVersion: "v3"
# Slack channel ID (for example "C0123456789") that results releases are posted to by
# nordic-live (live) and nordic-reports (late fallback). Empty disables Slack posting.
# Invite the Argo CD notifications Slack app to the channel first.
nordicSlack:
  channel: ""
nordicLive:
  # RUST_LOG for the live listener (info logs every new relevant item).
  logLevel: "info"
filings:
  lookbackDays: "90"
resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
# Seconds a finished chronicle Job (succeeded or failed) is kept before
# Kubernetes deletes it. Bounds how long ChronicleJobFailed / KubeJobFailed
# fire for one failure: a job that keeps failing alerts again on its next run.
jobTtlSecondsAfterFinished: 86400
