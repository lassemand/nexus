image:
  repository: "lmapwns/nexus"
  tag: "0.10.0"
schedules:
  chronicle: "0 6 * * *"
  market: "0 22 * * 1-5"
  earnings: "0 7 * * *"
  filings: "0 6 * * 1-5"
  nordicReports: "0 22 * * *"
  nordicCalendar: "30 6 * * *"
# RUST_LOG for every chronicle workload. Needed: with tracing-subscriber's
# env-filter feature, an unset RUST_LOG means errors only.
logLevel: "info"
# Pushgateway the CronJobs push their run metrics to (PUSHGATEWAY_URL).
pushgatewayUrl: "http://pushgateway.nexus.svc.cluster.local:9091"
saxo:
  # Saxo chart API version for daily bars (SAXO_CHART_VERSION). v1 answered
  # 404 for GOMX on the live gateway (NEX-183).
  chartVersion: "v3"
  # Container port of /health, /metrics and POST /tokens (HEALTH_PORT). The NodePort
  # Service `saxo-stream` (32080, port 8080) targets it.
  healthPort: 8081
  # Container port of the internal quote endpoint (QUOTE_PORT, NEX-249), exposed as
  # port 8080 by the ClusterIP Service `saxo-quotes`.
  quotePort: 8080
  # Namespace allowed to reach the quote endpoint (NetworkPolicy `saxo-quotes`).
  quoteClientNamespace: "analyst"
nordicLive:
  # RUST_LOG for the live listener (info logs every new relevant item).
  logLevel: "info"
  # Slack channel ID (for example "C0123456789") that results releases are posted to.
  # Empty disables Slack posting. Invite the Argo CD notifications Slack app first.
  slackChannel: "C0CDPCD42Q2" # #nordic-reports
  # Slack channel ID that company announcements are posted to (NEX-239), with the same bot
  # token. Empty disables announcement posting; independent of slackChannel. Invite the Argo CD
  # notifications Slack app to the channel first.
  announcementsChannel: ""
filings:
  lookbackDays: "90"
resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
# Seconds a finished chronicle Job (succeeded or failed) is kept before
# Kubernetes deletes it. Bounds how long ChronicleJobFailed / KubeJobFailed
# fire for one failure: a job that keeps failing alerts again on its next run.
jobTtlSecondsAfterFinished: 86400
