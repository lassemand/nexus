apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: saxo-secret
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: nexus-secret-store
    kind: ClusterSecretStore

  target:
    name: saxo-secret
    creationPolicy: Owner

  data:
    # OAuth2 application credentials (static — do not rotate without updating Vault).
    - secretKey: SAXO_CLIENT_ID
      remoteRef:
        key: nexus/saxo
        property: client_id

    - secretKey: SAXO_CLIENT_SECRET
      remoteRef:
        key: nexus/saxo
        property: client_secret

    - secretKey: SAXO_API_BASE
      remoteRef:
        key: nexus/saxo
        property: api_base

    - secretKey: SAXO_STREAMING_BASE
      remoteRef:
        key: nexus/saxo
        property: streaming_base

    - secretKey: SAXO_AUTH_BASE
      remoteRef:
        key: nexus/saxo
        property: auth_base
