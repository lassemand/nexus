# SIGNAL_DATABASE_URL and SLACK_BOT_TOKEN for nordic-live (NEX-222). SLACK_BOT_TOKEN is the
# Slack bot token Argo CD notifications already uses (nexus/argocd-notifications SLACK_TOKEN,
# scope chat:write); the posts appear under that Slack app's name.
# SIGNAL_DATABASE_URL: the same Vault entry signal uses for its own
# database (nexus/signal DATABASE_URL, user nexus, database backtest). nordic-live only
# SELECTs and opens its connections read-only. This is a separate secret on purpose: if
# Vault refuses the read, only the optional "already ingested" check is lost and the
# other chronicle workloads, which share chronicle-secret, are unaffected.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nordic-live-secret
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: nexus-secret-store
    kind: ClusterSecretStore

  target:
    name: nordic-live-secret
    creationPolicy: Owner

  data:
    - secretKey: SIGNAL_DATABASE_URL
      remoteRef:
        key: nexus/signal
        property: DATABASE_URL
    - secretKey: SLACK_BOT_TOKEN
      remoteRef:
        key: nexus/argocd-notifications
        property: SLACK_TOKEN
