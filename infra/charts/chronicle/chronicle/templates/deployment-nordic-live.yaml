# Live MFN listener (NEX-170): logs Nordic releases the moment they are published,
# emits company announcements to special.events within seconds (NEX-241) and,
# when nordicLive.slackChannel is set, posts results releases to Slack (NEX-222), and
# company announcements to nordicLive.announcementsChannel when that is set (NEX-239). Its
# only write is the slack_report_posts claim in chronicle's database; the nordic-reports
# poll stays the only writer of reports and the fallback for anything missed while the
# socket is down.
#   kubectl --context orbstack -n chronicle logs deploy/nordic-live -f
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nordic-live
  labels:
    app: nordic-live
spec:
  replicas: 1
  # One listener at a time: a second would log every item twice.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nordic-live
  template:
    metadata:
      labels:
        app: nordic-live
    spec:
      containers:
        - name: nordic-live
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/nordic-live"]
          ports:
            - name: metrics
              containerPort: 9464
              protocol: TCP
          env:
            - name: RUST_LOG
              value: {{ .Values.nordicLive.logLevel | quote }}
            - name: OTEL_SERVICE_NAME
              value: nordic-live
            {{- if .Values.nordicLive.otlpEndpoint }}
            # Where trace spans go (empty/unset: no export). HOSTNAME, the pod name,
            # becomes the host.name resource attribute.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.nordicLive.otlpEndpoint | quote }}
            {{- end }}
            {{- if .Values.nordicLive.slackChannel }}
            # Slack channel ID (not the name); empty/unset disables Slack posting.
            - name: SLACK_CHANNEL
              value: {{ .Values.nordicLive.slackChannel | quote }}
            {{- end }}
            {{- if .Values.nordicLive.announcementsChannel }}
            # Slack channel ID (not the name) for company announcements; empty/unset disables them.
            - name: SLACK_ANNOUNCEMENTS_CHANNEL
              value: {{ .Values.nordicLive.announcementsChannel | quote }}
            {{- end }}
          envFrom:
            # DATABASE_URL: chronicle's database (the registered companies).
            # KAFKA_BROKERS: the same Kafka the nordic-reports CronJob publishes to;
            # with it nordic-live emits company_announcement events (NEX-241) and
            # released reports to special.events. SPECIAL_EVENTS_TOPIC is not set
            # anywhere, so both use the default "special.events".
            - secretRef:
                name: chronicle-secret
            # SIGNAL_DATABASE_URL: signal's database, for the poll's
            # "already ingested" check and the session labels. SLACK_BOT_TOKEN: the
            # Slack bot token. Optional: without them every relevant item is logged
            # as new, messages have no session, and Slack stays off.
            - secretRef:
                name: nordic-live-secret
                optional: true
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory | quote }}
              cpu: {{ .Values.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.resources.limits.memory | quote }}
