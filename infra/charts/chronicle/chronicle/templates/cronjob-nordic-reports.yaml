apiVersion: batch/v1
kind: CronJob
metadata:
  name: nordic-reports
  labels:
    app: nordic-reports
spec:
  # Hourly 07:00-20:00 on weekdays plus 22:00, Stockholm time. Incremental runs
  # stop at the first known disclosure_id, so hourly runs cost ~1 request per
  # company and pick up calendar changes quickly.
  schedule: {{ .Values.schedules.nordicReports | quote }}
  timeZone: "Europe/Stockholm"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: nordic-reports
        spec:
          restartPolicy: OnFailure
          containers:
            - name: nordic-reports
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: IfNotPresent
              command: ["/usr/local/bin/nordic-reports"]
              envFrom:
                - secretRef:
                    name: chronicle-secret
              resources:
                requests:
                  memory: {{ .Values.resources.requests.memory | quote }}
                  cpu: {{ .Values.resources.requests.cpu | quote }}
                limits:
                  memory: {{ .Values.resources.limits.memory | quote }}
