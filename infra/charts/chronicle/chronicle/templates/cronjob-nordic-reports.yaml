apiVersion: batch/v1
kind: CronJob
metadata:
  name: nordic-reports
  labels:
    app: nordic-reports
spec:
  # Daily at 22:00 Stockholm time, after the day's releases (Nordic issuers
  # publish mostly 07:00-08:30). Reports don't change often; the release
  # instant comes from MFN's publish_date, not from when the run sees it.
  # Incremental runs read back to the feed cursor (~1 request per company).
  schedule: {{ .Values.schedules.nordicReports | quote }}
  timeZone: "Europe/Stockholm"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Finished Jobs (and their failure alert) are removed after this; pod logs
      # stay in Loki. Without it a failed Job is kept until 3 newer failures.
      ttlSecondsAfterFinished: {{ .Values.jobTtlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            app: nordic-reports
        spec:
          restartPolicy: OnFailure
          containers:
            - name: nordic-reports
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: IfNotPresent
              command: ["/usr/local/bin/nordic-reports"]
              env:
                - name: RUST_LOG
                  value: {{ .Values.logLevel | quote }}
                {{- if .Values.nordicSlack.channel }}
                # Late Slack fallback (NEX-223): posts results releases nordic-live missed.
                # The token is nordic-live's (Argo CD notifications bot token); without the
                # secret, or with an empty channel, Slack stays off.
                - name: SLACK_CHANNEL
                  value: {{ .Values.nordicSlack.channel | quote }}
                - name: SLACK_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: nordic-live-secret
                      key: SLACK_BOT_TOKEN
                      optional: true
                {{- end }}
              envFrom:
                - secretRef:
                    name: chronicle-secret
              resources:
                requests:
                  memory: {{ .Values.resources.requests.memory | quote }}
                  cpu: {{ .Values.resources.requests.cpu | quote }}
                limits:
                  memory: {{ .Values.resources.limits.memory | quote }}
