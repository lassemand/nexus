# Prometheus scrapes nordic_slack_posts_total from nordic-live's /metrics through
# the PodMonitor in podmonitor-nordic-live.yaml (job `nordic-live`).
apiVersion: v1
kind: Service
metadata:
  name: nordic-live
  labels:
    app: nordic-live
spec:
  type: ClusterIP
  selector:
    app: nordic-live
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
