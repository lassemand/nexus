image:
  repository: "lmapwns/nexus-conductor"
  # 0.1.4 is the first tag that contains the entrypoint this chart's `command`
  # points at. 0.1.3 and earlier were built before NEX-134 merged, so they have
  # no /usr/local/bin/conductor-entrypoint and the pod would crash-loop on a
  # missing file. (0.1.0 and 0.1.1 additionally carry two defects the
  # in-container workspace build found: a login shell lost the Rust toolchain
  # from PATH, and clippy/rustfmt were on the wrong toolchain.)
  tag: "0.1.8"
claude:
  # Model for every Claude process conductor starts (`--model`). `sonnet` is an
  # alias that follows the newest Sonnet known to the image's pinned Claude Code
  # version (CLAUDE_CODE_VERSION in infra/Dockerfile.conductor): Sonnet 5.5,
  # `claude-sonnet-5-5`, today. Bumping Claude Code can move it to a newer
  # Sonnet. To pin, set a full model ID such as `claude-sonnet-5-5`.
  # Empty uses Claude Code's own default.
  model: "sonnet"
# Maximum concurrent Claude sessions. See the memory note on resources below
# before raising this.
maxSessions: 5
# Interactive Claude sessions (one tmux session per set) kept resident at once,
# idle ones included. Separate from maxSessions, which bounds concurrent turns.
maxLiveSessions: 10
# Seconds to wait for a new session's SessionStart hook / for a pasted prompt's
# UserPromptSubmit hook before giving up.
startTimeoutSecs: 60
deliverTimeoutSecs: 30
tmux:
  # Shared by conductor and `kubectl exec … tmux -L conductor attach`.
  socket: conductor
  # Loopback listener for `conductor hook`; never exposed outside the pod.
  hookPort: 8789
# Minutes between sweeps that close idle groups whose Linear set is complete.
# 0 disables the sweep; webhook-triggered checks still run.
closeSweepMins: 30
# Users whose pull request comments are routed to a session.
githubWebhookUsers: "lassemand"
persistence:
  # Holds /data/home (Claude transcripts — `claude --resume` depends on them
  # surviving a restart), /data/repo, /data/worktrees (each with its own cargo
  # target/) and /data/state.
  size: 100Gi
resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    # Besides the builds below, up to maxLiveSessions idle interactive Claude
    # processes stay resident. TODO(NEX-144): measure one idle process's RSS in
    # the deployed pod and record it here; the limit is unchanged until then.
    #
    # Each concurrent session may run a workspace `cargo build`, which peaks
    # around 2–3 GiB. So maxSessions × 3Gi has to fit inside this limit *and*
    # inside the OrbStack VM's memory setting. If they do not both hold, lower
    # maxSessions — raising this past what the VM actually has just moves the
    # failure from a cargo OOM to the pod being OOMKilled, which takes every
    # running agent with it.
    memory: "16Gi"
    # No CPU limit on purpose: parallel cargo builds are bursty, and throttling
    # them lengthens every run without bounding anything that matters.
# Webhook intake. Enabled at the NEX-132 cutover.
#
# The sidecars dial *out* to Hookdeck and forward into localhost:8788, so this
# needs no Service, no ingress and no change to the Hookdeck sources — the pod
# simply becomes the CLI client that was previously running on a laptop.
#
# Exactly one CLI client may be connected per source. While the laptop's
# `hookdeck listen` was also connected, an event could be handled twice, and
# there is no delivery dedup: one ticket would become two agents on two
# branches opening two pull requests. The laptop listeners were stopped before
# this was flipped, and Hookdeck reported CLI_UNAVAILABLE in the gap between
# the two — those events are retained and can be retried once the pod attaches.
hookdeck:
  enabled: true
  # Tags in this repository are v-prefixed; "0.14.1" was pinned here while the
  # sidecars were disabled and never existed at all, which nothing caught
  # because a disabled container is never pulled.
  #
  # v2.1.1 is the version that forwarded these same sources with these same
  # arguments from a laptop for weeks. The CLI derives the destination name
  # from the source ("{source}-cli"), so a version that changed that derivation
  # would attach to a destination the existing connections do not route to —
  # intake would look healthy and deliver nothing. v3.1.0 is available and
  # keeps the same `ci` and `listen [port] [source] --path` surface, so moving
  # is a one-line change once there is a reason to.
  image: "hookdeck/hookdeck-cli:v2.1.1"
  resources:
    requests:
      memory: "32Mi"
    limits:
      memory: "128Mi"
