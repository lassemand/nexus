image:
  repository: "lmapwns/nexus-conductor"
  # 0.1.4 is the first tag that contains the entrypoint this chart's `command`
  # points at. 0.1.3 and earlier were built before NEX-134 merged, so they have
  # no /usr/local/bin/conductor-entrypoint and the pod would crash-loop on a
  # missing file. (0.1.0 and 0.1.1 additionally carry two defects the
  # in-container workspace build found: a login shell lost the Rust toolchain
  # from PATH, and clippy/rustfmt were on the wrong toolchain.)
  # 0.1.16 is the first image with the review session boundary (NEX-285): the
  # uid switch, the wrappers and the fail-closed identity. `review.enabled`
  # below is true, and an image older than this would run reviews without
  # that boundary, so the tag and the switch change together. Push the tag
  # `conductor-v0.1.16` (release-conductor.yml) before merging.
  tag: "0.1.21"
claude:
  # Model for every Claude process conductor starts (`--model`). `sonnet` is an
  # alias that follows the newest Sonnet known to the image's pinned Claude Code
  # version (CLAUDE_CODE_VERSION in infra/Dockerfile.conductor): Sonnet 5.5,
  # `claude-sonnet-5-5`, today. Bumping Claude Code can move it to a newer
  # Sonnet. To pin, set a full model ID such as `claude-sonnet-5-5`.
  # Empty uses Claude Code's own default.
  # This is the default for every set: a set can override it with a
  # `model: <alias-or-id>` line in its `session:<name>` Linear label's description.
  model: "sonnet"
# Maximum concurrent runs across all sets — how many agents may be working at
# once. A set holds one of these only while Starting, Delivering or Busy; an
# idle Ready session holds nothing, so this is a cap on work in flight, not on
# resident sessions (that is maxLiveSessions below).
#
# 2, because of the arithmetic the resources note below describes. Each
# concurrent run may peak around 3 GiB in a workspace `cargo build`, and the
# OrbStack VM reports 7.8 GiB allocatable:
#
#   maxSessions 5 x 3 GiB = 15 GiB   does not fit, and cannot: the host has
#                                    16 GiB total with ~5.5 GiB for macOS, so
#                                    no VM memory setting makes 15 GiB available
#   maxSessions 3 x 3 GiB =  9 GiB   needs the VM raised to ~10 GiB, leaving
#                                    macOS ~6 GiB while it currently wants 5.5
#   maxSessions 2 x 3 GiB =  6 GiB   fits what the VM already has
#
# Measured on the host (NEX-124): 16384 MiB total, 2570 MiB wired, 2933 MiB
# already compressed. Raising the VM's memory_mib is possible but restarts it,
# which tears down the cluster and every running agent; see
# infra/terraform/README.md.
maxSessions: 2
# Interactive Claude sessions (one tmux session per set) kept resident at once,
# idle ones included. Separate from maxSessions, which bounds concurrent turns.
#
# 3, from the measurement in the resources block: ~440 MiB per resident
# session. At 10 that is 4.4 GiB of idle alone, which does not fit beside two
# 3 GiB builds in what the node leaves conductor (~3.8 GiB today). At 3 it is
# 1.3 GiB.
#
# Evicting a session is cheap: the transcript stays and the next task resumes
# it, so a low number costs a resume rather than any work.
maxLiveSessions: 3
# Seconds to wait for a new session's SessionStart hook / for a pasted prompt's
# UserPromptSubmit hook before giving up.
startTimeoutSecs: 60
deliverTimeoutSecs: 30
tmux:
  # Shared by conductor and `kubectl exec … tmux -L conductor attach`.
  socket: conductor
  # Loopback listener for `conductor hook`; never exposed outside the pod.
  hookPort: 8789
# Minutes between sweeps that close idle groups whose Linear set is complete.
# 0 disables the sweep; webhook-triggered checks still run.
closeSweepMins: 30
# Users whose pull request comments are routed to a session.
githubWebhookUsers: "lassemand"
# Automatic reviews (NEX-272): every issue entering `state` gets a fresh
# review session running the `reviewer` agent on its open pull requests; a
# `/review` comment from a githubWebhookUsers login asks for one by hand. See
# this chart's README, "Reviews".
review:
  # false turns every automatic and manual trigger off. On since NEX-285, which
  # closed the review session's sandbox gaps found in the review of PR 325
  # (README, "The review session's boundary"): a separate uid, argument-checking
  # wrappers instead of raw git/cargo/gh, Linear write tools denied, reviews only
  # for allowed authors, and a fail-closed identity. Needs
  # REVIEW_GITHUB_APP_* in Vault; without them
  # no review starts and each trigger says why in Linear.
  enabled: true
  # Linear state whose entry starts an automatic review.
  state: "In Review"
  # Send-backs per issue before automatic reviews stop (then `needs-human` and
  # `/review` only). 0 means manual reviews only.
  maxIterations: 2
  # Model of review sessions; same rules as claude.model.
  model: "opus"
  # Concurrent review sessions, counted apart from maxSessions so a review
  # never takes a slot from implementation work.
  #
  # 1, and memory.limit stays 6Gi. A review session is one more resident
  # Claude (~440 MiB, the NEX-144 measurement below), so beside two
  # implementation runs it fits as long as the reviewer does not build the
  # whole workspace: maxSessions 2 x 3 GiB = 6 GiB already fills the limit, and
  # the limit cannot go higher, because the node has 7.8 GiB allocatable and
  # other workloads request 4.0 GiB of it. The reviewer's instructions
  # (infra/agents/reviewer.md) keep its builds to the crates a pull request
  # touches for that reason.
  maxSessions: 1
  # A review turn longer than this is interrupted and counted as failed:
  # 45m, 2700s or 1h.
  timeout: "45m"
  # GitHub login of the reviewer app, e.g. `annette-review[bot]`. Its comments
  # and reviews are never dispatched to a session; the send-back reaches the
  # author through the move to Todo. Leave empty: the entrypoint reads it from
  # the reviewer app (`GET /app`) at startup. Set it only to override that.
  botLogin: ""
  # Pull request label that asks for a manual review, exactly like a `/review`
  # comment. Only a githubWebhookUsers login adding it counts; conductor removes
  # it once handled so it can be added again. GitHub cannot request a review
  # from an app, so this is the click. Create the label once in the repository.
  # Empty turns the label trigger off.
  label: "review"
  # CI gate (NEX-275): an issue enters review only with every check run on its
  # pull requests green. Otherwise it is bounced and watched.
  ci:
    # How often watched issues are re-checked, in case a webhook is lost.
    pollInterval: "60s"
    # How long an issue is watched for green CI before conductor gives up.
    maxWait: "2h"
# CARGO_TARGET_DIR shared by every session (CONDUCTOR_CARGO_TARGET_DIR). One
# workspace build instead of one per worktree (each was 4-40 GB). Parallel
# builds then wait on cargo's lock. Empty gives each worktree its own target/.
cargoTargetDir: "/data/target"
persistence:
  # Holds /data/home (Claude transcripts — `claude --resume` depends on them
  # surviving a restart), /data/repo, /data/worktrees, /data/target (the
  # shared cargo build directory, see cargoTargetDir) and /data/state.
  # local-path does not enforce this size.
  size: 100Gi
resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    # Measured in the deployed pod (NEX-144), not estimated:
    #
    #   container with no sessions        27 MiB
    #   container with one live session   466 MiB
    #     claude                            284 MiB RSS
    #     github-mcp-server                  28 MiB
    #     tmux server                         4 MiB
    #
    # So a resident idle session costs ~440 MiB, and a concurrent workspace
    # `cargo build` peaks around 3 GiB.
    #
    # 6Gi, not 16Gi. The old value could never bind: the node has 7.8 GiB
    # allocatable and other workloads request 4.0 GiB of it, so a 16 GiB limit
    # meant the *node* ran out before the container did — and node pressure
    # kills whatever it likes, which is how the pod died with
    # `reason=OutOfmemory` while this limit looked generous. A limit the node
    # can actually honour makes the container the one that dies.
    memory: "6Gi"
    # No CPU limit on purpose: parallel cargo builds are bursty, and throttling
    # them lengthens every run without bounding anything that matters.
# Webhook intake. Enabled at the NEX-132 cutover.
#
# The sidecars dial *out* to Hookdeck and forward into localhost:8788, so this
# needs no Service, no ingress and no change to the Hookdeck sources — the pod
# simply becomes the CLI client that was previously running on a laptop.
#
# Exactly one CLI client may be connected per source. While the laptop's
# `hookdeck listen` was also connected, an event could be handled twice, and
# there is no delivery dedup: one ticket would become two agents on two
# branches opening two pull requests. The laptop listeners were stopped before
# this was flipped, and Hookdeck reported CLI_UNAVAILABLE in the gap between
# the two — those events are retained and can be retried once the pod attaches.
hookdeck:
  enabled: true
  # Tags in this repository are v-prefixed; "0.14.1" was pinned here while the
  # sidecars were disabled and never existed at all, which nothing caught
  # because a disabled container is never pulled.
  #
  # v2.1.1 is the version that forwarded these same sources with these same
  # arguments from a laptop for weeks. The CLI derives the destination name
  # from the source ("{source}-cli"), so a version that changed that derivation
  # would attach to a destination the existing connections do not route to —
  # intake would look healthy and deliver nothing. v3.1.0 is available and
  # keeps the same `ci` and `listen [port] [source] --path` surface, so moving
  # is a one-line change once there is a reason to.
  image: "hookdeck/hookdeck-cli:v2.1.1"
  resources:
    requests:
      memory: "32Mi"
    limits:
      memory: "128Mi"
