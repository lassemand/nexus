# Secrets for conductor, from Vault path secret/nexus/conductor.
#
# `dataFrom: extract` rather than per-key `data` entries: every property in the
# path becomes an env var of the same name, so an optional property that has
# not been written yet does not fail the whole secret. With per-key entries,
# one missing key leaves the pod with no secret at all.
#
# Expected properties — see this chart's README for the exact `vault kv put`:
#   DATABASE_URL              the conductor database (required; the registry
#                             will not start without it)
#   GITHUB_TOKEN              contents rw, pull requests rw, issues rw
#   LINEAR_API_KEY            Linear MCP server
#   GITHUB_WEBHOOK_SECRET     webhook signature verification
#   HOOKDECK_API_KEY          only needed once hookdeck.enabled is true
#   CONDUCTOR_AUTH_MODE       "subscription" or "api_key"
#   and exactly one of:
#   CLAUDE_CODE_CREDENTIALS_JSON   subscription; renews itself (preferred)
#   CLAUDE_CODE_OAUTH_TOKEN        subscription; expires in ~2h, cannot renew
#   ANTHROPIC_API_KEY              metered API billing
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: conductor-secret
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: nexus-secret-store
    kind: ClusterSecretStore

  target:
    name: conductor-secret
    creationPolicy: Owner

  dataFrom:
    - extract:
        key: nexus/conductor
