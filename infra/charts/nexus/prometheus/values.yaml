prometheus-operator-crds:
  crds:
    # kube-prometheus-stack CRDs are too large for client-side apply
    # ("metadata.annotations: Too long") and the ApplicationSet has no
    # ServerSideApply. Apply only these CRDs server-side.
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=true

kube-prometheus-stack:
  # CRDs come from the prometheus-operator-crds dependency above.
  crds:
    enabled: false

  # Our own Grafana (infra/charts/nexus/grafana) owns its datasources and
  # runs the dashboard sidecar. Only render kps's dashboard ConfigMaps
  # (label grafana_dashboard: "1") for it.
  grafana:
    enabled: false
    forceDeployDashboards: true
    forceDeployDatasources: false
    sidecar:
      dashboards:
        # Put every kps dashboard in the "Kubernetes" Grafana folder; the
        # sidecar's folderAnnotation is set in the grafana chart.
        annotations:
          grafana_folder: Kubernetes

  # Dashboards are code: not editable in the Grafana UI.
  defaultDashboardsEditable: false

  defaultRules:
    rules:
      # OrbStack's single-node cluster does not expose these components'
      # metrics the way kubeadm does; their *Down alerts would fire forever.
      etcd: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
      kubeControllerManager: false
      kubeProxy: false
    disabled:
      # A one-node cluster can never tolerate losing a node, so these always
      # fire and carry no information here.
      KubeCPUOvercommit: true
      KubeMemoryOvercommit: true

  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeProxy:
    enabled: false

  # node-exporter and kube-state-metrics stay on (kps defaults). It reports
  # the OrbStack Linux VM, not macOS. The kubelet/cAdvisor ServiceMonitor is
  # enabled by default as well.
  nodeExporter:
    enabled: true
    # The node is the OrbStack Linux VM, so the AIX and macOS node dashboards
    # could never show data.
    operatingSystems:
      aix:
        enabled: false
      darwin:
        enabled: false
  kubeStateMetrics:
    enabled: true
  kubelet:
    enabled: true

  # ── Alertmanager ────────────────────────────────────────────────────────
  alertmanager:
    enabled: true

    alertmanagerSpec:
      # Mounted at /etc/alertmanager/secrets/alertmanager-slack/. The operator
      # does not support --config.expand-env, so the webhook URL is read via
      # api_url_file below. The secret is created by the alertmanager-slack
      # ExternalSecret.
      secrets:
        - alertmanager-slack
      # Keeps silences and notification state across restarts.
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 1Gi

    config:
      global:
        resolve_timeout: 5m

      route:
        group_by: ["alertname", "namespace"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: slack-alerts
        routes:
          # Heartbeat / informational alerts never go to Slack.
          - matchers:
              - alertname =~ "Watchdog|InfoInhibitor"
            receiver: "null"
          # Critical alerts repeat every hour until resolved.
          - matchers:
              - severity = critical
            repeat_interval: 1h
          # Saxo token alerts are especially time-sensitive.
          - matchers:
              - alertname =~ "SaxoRefreshToken.*"
            repeat_interval: 30m

      receivers:
        - name: "null"
        - name: slack-alerts
          slack_configs:
            - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/SLACK_WEBHOOK_URL
              send_resolved: true
              title: >-
                [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
                {{ .CommonLabels.alertname }}
              text: |-
                {{ range .Alerts }}
                *Summary:* {{ .Annotations.summary }}
                *Description:* {{ .Annotations.description }}
                *Severity:* `{{ .Labels.severity }}`  |  *Namespace:* `{{ .Labels.namespace }}`
                {{ end }}

      # The chart's default inhibit rules / time intervals are kept.

  # ── Prometheus ──────────────────────────────────────────────────────────
  prometheus:
    service:
      type: LoadBalancer
      # TODO: pin with metallb.universe.tf/loadBalancerIPs once the current
      # IP of prometheus-server is supplied (see PR checklist). Never guess it.

    prometheusSpec:
      # Keep 30 days of metrics on a 20Gi local-path volume so history survives
      # pod restarts (reboots, ArgoCD syncs, evictions).
      retention: 30d
      # local-path volumes are plain directories in the OrbStack VM and the PVC
      # size is NOT enforced, so cap the TSDB below the volume size. Prometheus
      # deletes the oldest blocks first when either limit is reached.
      retentionSize: 18GB

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi

      # Pick up monitors and rules from any namespace/chart without label games.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false

      # Scrape saxo_stream Prometheus metrics from its /metrics endpoint.
      additionalScrapeConfigs:
        - job_name: saxo-stream
          static_configs:
            - targets:
                - saxo-stream.chronicle.svc.cluster.local:8080
          metrics_path: /metrics
