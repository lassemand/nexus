groups:
  - name: nexus.saxo-token
    rules:
      # Saxo token lifetimes: the access token lives ~20 minutes and the refresh
      # token ~1 hour. saxo_stream rotates the chain continuously, so a broken
      # rotation is fatal within about an hour and then needs a manual login.
      #
      # Fire when the refresh token expires in <30 min AND a rotation has
      # occurred. 30 min is half the refresh-token lifetime: rotation normally
      # keeps the remaining time far above it, so crossing it means at least one
      # rotation was missed, while leaving time to react before the chain dies.
      # The metric is -1 in bootstrap, before any rotation has happened;
      # `>= 0` suppresses the alert in that state. `for: 2m` rides out a
      # single slow scrape or rotation.
      - alert: SaxoRefreshTokenExpiringSoon
        expr: >
          saxo_refresh_token_seconds_remaining >= 0
          and saxo_refresh_token_seconds_remaining < 1800
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Saxo refresh token expires in {{ $value | humanizeDuration }}"
          description: >-
            The saxo_stream OAuth refresh token will expire in
            {{ $value | humanizeDuration }}. If it expires the entire Nordic
            data pipeline goes dark and manual re-authentication is required.
          runbook_url: "https://github.com/lassemand/nexus/blob/main/docs/guides/saxo-oauth-setup.md#recovery-if-the-refresh-token-is-invalid"

      # 0 means the token has run out; -1 (bootstrap) must stay silent.
      - alert: SaxoRefreshTokenExpired
        expr: saxo_refresh_token_seconds_remaining == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Saxo refresh token has expired"
          description: >-
            The Saxo refresh token has expired. The Nordic data pipeline is
            dark. Immediate manual re-authentication required.
          runbook_url: "https://github.com/lassemand/nexus/blob/main/docs/guides/saxo-oauth-setup.md#recovery-if-the-refresh-token-is-invalid"

      # Repeated refresh failures: an early warning before ExpiringSoon. A
      # transient failure is retried on the next 30s tick and almost always
      # succeeds, so a single one is noise (NEX-224: 9 a day, each recovered
      # 30s later). Three within 30 minutes means it is not recovering:
      # continuous failures (retried every 30s) fire after ~1 min, a rejected
      # token (retried every 10 min) after ~20 min, before the token expires.
      - alert: SaxoRefreshTokenFailure
        expr: increase(saxo_refresh_token_failures_total[30m]) >= 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Saxo token refresh keeps failing"
          description: >-
            The saxo_stream service failed to refresh its Saxo token
            {{ $value | humanize }} times in the last 30 minutes. If this
            persists the refresh token chain will break within ~1 hour.
          runbook_url: "https://github.com/lassemand/nexus/blob/main/docs/guides/saxo-oauth-setup.md#recovery-if-the-refresh-token-is-invalid"

  - name: nexus.ingestion
    rules:
      # nordic-live could not post a results release to Slack (NEX-222). The poll
      # fallback does not retry a failed live post for 10 minutes and gives up after
      # 5 attempts, so a failure that persists means releases are not reaching Slack:
      # check the bot token, `chat:write`, and that the app is invited to the channel
      # (the Slack error code is in the nordic-live logs, `slack post failed`).
      - alert: NordicSlackPostsFailing
        expr: increase(nordic_slack_posts_total{result="failed"}[30m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "nordic-live failed to post to Slack"
          description: >-
            nordic-live failed to post {{ $value | humanize }} results
            release(s) to Slack in the last 30 minutes. See `slack post failed`
            in the nordic-live logs for the Slack error code.

      # saxo-stream (Saxo token keeper + daily-bar sync) has been not-ready for >2m.
      - alert: SaxoStreamDown
        expr: |
          absent(kube_pod_status_ready{namespace="chronicle", pod=~"saxo-stream.*", condition="true"})
          or kube_pod_status_ready{namespace="chronicle", pod=~"saxo-stream.*", condition="true"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Saxo stream pod is down"
          description: >-
            The saxo-stream Deployment has had no ready pod for >2m.
            Live Nordic bar ingestion has stopped.

      - alert: ChronicleJobFailed
        expr: kube_job_status_failed{namespace="chronicle"} > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Chronicle CronJob failed"
          description: >-
            A CronJob in namespace chronicle has a failed execution.
            Check pod logs: kubectl logs -n chronicle -l job-name=<name>

  - name: nexus.database
    rules:
      - alert: PostgresPrimaryDown
        expr: |
          kube_pod_status_ready{namespace="nexus", pod="nexus-postgres-0", condition="true"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Postgres primary is down"
          description: >-
            nexus-postgres-0 is not ready. Signal writes and chronicle
            DB reads will fail until it recovers.

  - name: nexus.reliability
    rules:
      - alert: PodCrashLooping
        expr: |
          rate(kube_pod_container_status_restarts_total{
            namespace=~"chronicle|signal|nexus"
          }[15m]) * 900 > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} is crash-looping"
          description: >-
            Container {{ $labels.container }} in
            {{ $labels.namespace }}/{{ $labels.pod }} has restarted
            more than 3 times in 15 minutes.

  - name: nexus.log-pipeline
    rules:
      # Log pipeline: Alloy (DaemonSet) -> Loki (single binary) -> Backblaze B2.
      #
      # Metric names verified on 2026-10-27 by running Loki 3.6.11 (chart
      # grafana/loki 7.5.0, S3 storage, WAL, retention) and Alloy v1.21.2 (chart
      # grafana/alloy 1.14.3) locally and reading their /metrics, not on the
      # cluster (no kubectl there). Re-check on the running pods after deploying.
      #   Loki:  loki_ingester_chunks_flushed_total{reason}, loki_ingester_chunks_flush_failures_total,
      #          loki_distributor_lines_received_total, loki_s3_request_duration_seconds_count{status_code},
      #          loki_compactor_apply_retention_last_successful_run_timestamp_seconds,
      #          loki_discarded_samples_total{reason}, process_start_time_seconds
      #   Alloy: loki_write_dropped_entries_total{reason}, loki_write_batch_retries_total
      # Differences from the names in the task: Loki 3.6.11 with the chart's
      # default (non-thanos) object-store client exposes no
      # loki_objstore_bucket_operation_failures_total, and no
      # loki_compactor_last_successful_run_timestamp_seconds; the equivalents
      # used here are the S3 request status codes plus the chunk flush failure
      # counter, and the retention run timestamp.
      # Scrape job names are the Service names: `loki` and `alloy`.

      - alert: LokiDown
        # Fires when no Loki target is up (also covers a missing target; an absent()
        # of a comparison carries no labels, so the alert has none).
        expr: absent(up{job=~".*loki.*"} == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Loki is down"
          description: >-
            Loki is not being scraped successfully, so logs are not being
            stored. Check `kubectl -n nexus get pods -l app.kubernetes.io/name=loki`
            and `kubectl -n nexus logs statefulset/loki`.

      - alert: AlloyDown
        expr: absent(up{job="alloy"} == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No Alloy pod is up"
          description: >-
            No Alloy pod is up, so pod logs are being lost. Check
            `kubectl -n nexus get pods -l app.kubernetes.io/name=alloy` and
            `kubectl -n nexus logs daemonset/alloy`.

      # S3 404s are normal for Loki (missing optional objects), so they are
      # excluded. Failed chunk flushes are the dependable signal: they were seen
      # to increment when the object store was unreachable.
      - alert: LokiObjectStoreErrors
        expr: >
          sum(rate(loki_s3_request_duration_seconds_count{status_code!~"2..|404"}[5m])) > 0
          or sum(rate(loki_ingester_chunks_flush_failures_total[5m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Loki object-store requests are failing"
          description: >-
            Loki cannot write to or read from the Backblaze B2 bucket. This is
            usually an expired or revoked key or a B2 outage. Check the B2 key
            in Vault `secret/nexus/loki`, the `loki-s3` ExternalSecret, and
            `kubectl -n nexus logs statefulset/loki | grep -i s3`.

      # Chunks are cut at least every 2h (max_chunk_age), so 3h of received
      # logs without any flush means flushing is stuck. Only evaluated once
      # Loki has been up for 3h, so a fresh deploy cannot trip it.
      - alert: LokiChunksNotFlushing
        expr: >
          (sum(increase(loki_ingester_chunks_flushed_total[3h])) or vector(0)) == 0
          and sum(increase(loki_distributor_lines_received_total[3h])) > 0
          and on() (min(time() - process_start_time_seconds{job="loki"}) > 10800)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Loki has not flushed any chunk for 3h"
          description: >-
            Loki is receiving logs but has flushed no chunk to B2 in 3 hours,
            so the WAL is filling the local disk (10Gi PVC). Check
            `kubectl -n nexus logs statefulset/loki | grep -i flush` and the B2
            key in Vault `secret/nexus/loki`.

      # The metric is 0 until the first run, so this also fires if retention
      # never ran, but only once Loki has been up for 3h.
      - alert: LokiCompactorNotRunning
        expr: >
          (time() - loki_compactor_apply_retention_last_successful_run_timestamp_seconds > 10800)
          and on() (min(time() - process_start_time_seconds{job="loki"}) > 10800)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Loki retention has not run for 3h"
          description: >-
            The Loki compactor has not completed a retention run in over 3
            hours, so expired logs are not deleted and B2 storage and cost grow
            without limit. Check `kubectl -n nexus logs statefulset/loki | grep -i compactor`.

      - alert: AlloyLokiWriteFailing
        expr: >
          sum(rate(loki_write_dropped_entries_total[5m])) > 0
          or sum(rate(loki_write_batch_retries_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Alloy is failing to write logs to Loki"
          description: >-
            Alloy is retrying or dropping log batches sent to Loki. Check
            `kubectl -n nexus logs daemonset/alloy` and that Loki is up
            (`kubectl -n nexus get pods -l app.kubernetes.io/name=loki`).

      - alert: LokiRequestRateLimited
        expr: >
          sum by (reason) (rate(loki_discarded_samples_total{reason=~"rate_limited|stream_limit|per_stream_rate_limit"}[5m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Loki is dropping logs ({{ $labels.reason }})"
          description: >-
            Loki is discarding log lines because of its limits ({{ $labels.reason }}).
            Find the noisy stream in Grafana Explore (Loki) and either quieten
            it or raise the limit in infra/charts/nexus/loki/values.yaml.
