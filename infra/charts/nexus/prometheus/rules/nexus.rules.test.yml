# Unit tests for nexus.rules.yml. Run from this directory:
#   promtool test rules nexus.rules.test.yml
# Every alert has at least one firing and one silent case. Series use a 1m
# step ('a+bxN' = start a, add b, N more samples), '_' is a missing sample.
rule_files:
  - nexus.rules.yml

evaluation_interval: 1m

tests:
  # ── SaxoRefreshTokenExpiringSoon: 0 <= remaining < 1800s for 2m ──────────
  - name: ExpiringSoon fires at 10 minutes remaining after 2m
    input_series:
      - series: 'saxo_refresh_token_seconds_remaining'
        values: '600+0x20'
    alert_rule_test:
      - eval_time: 1m # pending, `for: 2m` not yet served
        alertname: SaxoRefreshTokenExpiringSoon
        exp_alerts: []
      - eval_time: 3m
        alertname: SaxoRefreshTokenExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Saxo refresh token expires in 10m 0s"
              description: "The saxo_stream OAuth refresh token will expire in 10m 0s. If it expires the entire Nordic data pipeline goes dark and manual re-authentication is required."
              runbook_url: "https://github.com/lassemand/nexus/blob/main/docs/guides/saxo-oauth-setup.md#recovery-if-the-refresh-token-is-invalid"

  - name: ExpiringSoon is silent at the -1 bootstrap sentinel
    input_series:
      - series: 'saxo_refresh_token_seconds_remaining'
        values: '-1+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: SaxoRefreshTokenExpiringSoon
        exp_alerts: []

  - name: ExpiringSoon is silent at or above 1800s
    input_series:
      - series: 'saxo_refresh_token_seconds_remaining{case="boundary"}'
        values: '1800+0x20'
      - series: 'saxo_refresh_token_seconds_remaining{case="healthy"}'
        values: '3500+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: SaxoRefreshTokenExpiringSoon
        exp_alerts: []

  - name: ExpiringSoon is silent when below 1800s for less than 2m
    input_series:
      # healthy for 4 samples (0-3m), then 600s remaining from 4m on
      - series: 'saxo_refresh_token_seconds_remaining'
        values: '3500+0x3 600+0x20'
    alert_rule_test:
      - eval_time: 5m # below threshold for ~1m
        alertname: SaxoRefreshTokenExpiringSoon
        exp_alerts: []
      - eval_time: 7m # below threshold for ~3m
        alertname: SaxoRefreshTokenExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Saxo refresh token expires in 10m 0s"
              description: "The saxo_stream OAuth refresh token will expire in 10m 0s. If it expires the entire Nordic data pipeline goes dark and manual re-authentication is required."
              runbook_url: "https://github.com/lassemand/nexus/blob/main/docs/guides/saxo-oauth-setup.md#recovery-if-the-refresh-token-is-invalid"

  # ── SaxoRefreshTokenExpired: remaining == 0 for 1m ───────────────────────
  - name: Expired fires at 0 after 1m
    input_series:
      - series: 'saxo_refresh_token_seconds_remaining'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 30s
        alertname: SaxoRefreshTokenExpired
        exp_alerts: []
      - eval_time: 2m
        alertname: SaxoRefreshTokenExpired
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Saxo refresh token has expired"
              description: "The Saxo refresh token has expired. The Nordic data pipeline is dark. Immediate manual re-authentication required."
              runbook_url: "https://github.com/lassemand/nexus/blob/main/docs/guides/saxo-oauth-setup.md#recovery-if-the-refresh-token-is-invalid"

  - name: Expired is silent at the -1 bootstrap sentinel and while time remains
    input_series:
      - series: 'saxo_refresh_token_seconds_remaining{case="bootstrap"}'
        values: '-1+0x20'
      - series: 'saxo_refresh_token_seconds_remaining{case="valid"}'
        values: '600+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: SaxoRefreshTokenExpired
        exp_alerts: []

  # ── SaxoRefreshTokenFailure: >= 3 failures within 30m ───────────────────
  - name: Failure is silent for a single transient failure
    input_series:
      # one failure at 6m, recovered on the next tick
      - series: 'saxo_refresh_token_failures_total'
        values: '0+0x5 1+0x40'
    alert_rule_test:
      - eval_time: 7m
        alertname: SaxoRefreshTokenFailure
        exp_alerts: []
      - eval_time: 30m
        alertname: SaxoRefreshTokenFailure
        exp_alerts: []

  - name: Failure is silent for blips 35 minutes apart
    input_series:
      # failures at 5m and 40m (today's pattern)
      - series: 'saxo_refresh_token_failures_total'
        values: '0+0x4 1+0x34 2+0x30'
    alert_rule_test:
      - eval_time: 45m
        alertname: SaxoRefreshTokenFailure
        exp_alerts: []

  - name: Failure fires when refreshes keep failing, then clears
    input_series:
      # failing continuously from 5m to 10m (2 per minute), then recovered
      - series: 'saxo_refresh_token_failures_total'
        values: '0+0x4 2+2x5 12+0x40'
    alert_rule_test:
      - eval_time: 4m
        alertname: SaxoRefreshTokenFailure
        exp_alerts: []
      - eval_time: 7m
        alertname: SaxoRefreshTokenFailure
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Saxo token refresh keeps failing"
              description: "The saxo_stream service failed to refresh its Saxo token 6 times in the last 30 minutes. If this persists the refresh token chain will break within ~1 hour."
              runbook_url: "https://github.com/lassemand/nexus/blob/main/docs/guides/saxo-oauth-setup.md#recovery-if-the-refresh-token-is-invalid"
      - eval_time: 45m # the failures have left the 30m window
        alertname: SaxoRefreshTokenFailure
        exp_alerts: []

  - name: Failure fires for a rejected token retried every 10 minutes
    input_series:
      # rejections at 5m, 15m and 25m
      - series: 'saxo_refresh_token_failures_total'
        values: '0+0x4 1+0x9 2+0x9 3+0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: SaxoRefreshTokenFailure
        exp_alerts: []
      - eval_time: 26m
        alertname: SaxoRefreshTokenFailure
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Saxo token refresh keeps failing"
              description: "The saxo_stream service failed to refresh its Saxo token 3 times in the last 30 minutes. If this persists the refresh token chain will break within ~1 hour."
              runbook_url: "https://github.com/lassemand/nexus/blob/main/docs/guides/saxo-oauth-setup.md#recovery-if-the-refresh-token-is-invalid"

  - name: Failure is silent when the counter stays flat
    input_series:
      - series: 'saxo_refresh_token_failures_total'
        values: '3+0x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: SaxoRefreshTokenFailure
        exp_alerts: []

  # ── SaxoStreamDown: no ready pod for 2m (absent, or ready == 0) ──────────
  - name: SaxoStreamDown fires when the series is absent
    input_series:
      # an unrelated pod, so only the saxo-stream series is missing
      - series: 'kube_pod_status_ready{namespace="chronicle", pod="other-0", condition="true"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 1m
        alertname: SaxoStreamDown
        exp_alerts: []
      - eval_time: 3m
        alertname: SaxoStreamDown
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: chronicle
              condition: "true"
            exp_annotations:
              summary: "Saxo stream pod is down"
              description: "The saxo-stream Deployment has had no ready pod for >2m. Live Nordic bar ingestion has stopped."

  - name: SaxoStreamDown fires when the pod is not ready
    input_series:
      - series: 'kube_pod_status_ready{namespace="chronicle", pod="saxo-stream-abc", condition="true"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 1m
        alertname: SaxoStreamDown
        exp_alerts: []
      - eval_time: 3m
        alertname: SaxoStreamDown
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: chronicle
              pod: saxo-stream-abc
              condition: "true"
            exp_annotations:
              summary: "Saxo stream pod is down"
              description: "The saxo-stream Deployment has had no ready pod for >2m. Live Nordic bar ingestion has stopped."

  - name: SaxoStreamDown is silent when the pod is ready
    input_series:
      - series: 'kube_pod_status_ready{namespace="chronicle", pod="saxo-stream-abc", condition="true"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: SaxoStreamDown
        exp_alerts: []

  # ── ChronicleJobFailed: any failed job in namespace chronicle ────────────
  - name: ChronicleJobFailed fires for a failed chronicle job
    input_series:
      - series: 'kube_job_status_failed{namespace="chronicle", job_name="market-123"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: ChronicleJobFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: chronicle
              job_name: market-123
            exp_annotations:
              summary: "Chronicle CronJob failed"
              description: "A CronJob in namespace chronicle has a failed execution. Check pod logs: kubectl logs -n chronicle -l job-name=<name>"

  - name: ChronicleJobFailed is silent for other namespaces and zero failures
    input_series:
      - series: 'kube_job_status_failed{namespace="signal", job_name="x-1"}'
        values: '1+0x10'
      - series: 'kube_job_status_failed{namespace="chronicle", job_name="market-124"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: ChronicleJobFailed
        exp_alerts: []

  # ── PostgresPrimaryDown: nexus-postgres-0 not ready for 1m ───────────────
  - name: PostgresPrimaryDown fires when nexus-postgres-0 is not ready
    input_series:
      - series: 'kube_pod_status_ready{namespace="nexus", pod="nexus-postgres-0", condition="true"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 30s
        alertname: PostgresPrimaryDown
        exp_alerts: []
      - eval_time: 2m
        alertname: PostgresPrimaryDown
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: nexus
              pod: nexus-postgres-0
              condition: "true"
            exp_annotations:
              summary: "Postgres primary is down"
              description: "nexus-postgres-0 is not ready. Signal writes and chronicle DB reads will fail until it recovers."

  - name: PostgresPrimaryDown is silent when ready or for another pod
    input_series:
      - series: 'kube_pod_status_ready{namespace="nexus", pod="nexus-postgres-0", condition="true"}'
        values: '1+0x10'
      - series: 'kube_pod_status_ready{namespace="nexus", pod="nexus-postgres-1", condition="true"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: PostgresPrimaryDown
        exp_alerts: []

  # ── PodCrashLooping: >3 restarts per 15m, sustained 5m ───────────────────
  - name: PodCrashLooping fires above 3 restarts per 15m in a watched namespace
    input_series:
      # one restart per minute
      - series: 'kube_pod_container_status_restarts_total{namespace="chronicle", pod="saxo-stream-abc", container="saxo-stream"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 3m # rate is high, but `for: 5m` is not yet served
        alertname: PodCrashLooping
        exp_alerts: []
      - eval_time: 15m
        alertname: PodCrashLooping
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: chronicle
              pod: saxo-stream-abc
              container: saxo-stream
            exp_annotations:
              summary: "Pod saxo-stream-abc is crash-looping"
              description: "Container saxo-stream in chronicle/saxo-stream-abc has restarted more than 3 times in 15 minutes."

  - name: PodCrashLooping is silent for other namespaces and for 3 restarts or fewer
    input_series:
      # same rate, unwatched namespace
      - series: 'kube_pod_container_status_restarts_total{namespace="default", pod="noisy-0", container="app"}'
        values: '0+1x40'
      # ~1.5 restarts per 15m in a watched namespace
      - series: 'kube_pod_container_status_restarts_total{namespace="signal", pod="signal-0", container="signal"}'
        values: '0+0.1x40'
      # no restarts at all
      - series: 'kube_pod_container_status_restarts_total{namespace="nexus", pod="steady-0", container="app"}'
        values: '5+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PodCrashLooping
        exp_alerts: []

  # ── log-pipeline group (NEX-180) ─────────────────────────────────────────
  # Series use a 1m step; 'a+bxN' = start a, add b, N more samples.

  - name: LokiDown fires when the loki target is down
    input_series:
      - series: 'up{job="loki"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 3m
        alertname: LokiDown
        exp_alerts: []
      - eval_time: 6m
        alertname: LokiDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Loki is down"
              description: "Loki is not being scraped successfully, so logs are not being stored. Check `kubectl -n nexus get pods -l app.kubernetes.io/name=loki` and `kubectl -n nexus logs statefulset/loki`."

  - name: LokiDown fires when the loki target has disappeared
    input_series:
      - series: 'up{job="alloy"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 6m
        alertname: LokiDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Loki is down"
              description: "Loki is not being scraped successfully, so logs are not being stored. Check `kubectl -n nexus get pods -l app.kubernetes.io/name=loki` and `kubectl -n nexus logs statefulset/loki`."

  - name: LokiDown is silent when loki is up
    input_series:
      - series: 'up{job="loki"}'
        values: '1x40'
      - series: 'up{job="alloy"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: LokiDown
        exp_alerts: []

  - name: AlloyDown fires when every alloy pod is down
    input_series:
      - series: 'up{job="alloy",pod="alloy-a"}'
        values: '0x40'
      - series: 'up{job="alloy",pod="alloy-b"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 3m
        alertname: AlloyDown
        exp_alerts: []
      - eval_time: 6m
        alertname: AlloyDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "No Alloy pod is up"
              description: "No Alloy pod is up, so pod logs are being lost. Check `kubectl -n nexus get pods -l app.kubernetes.io/name=alloy` and `kubectl -n nexus logs daemonset/alloy`."

  - name: AlloyDown fires when no alloy target exists
    input_series:
      - series: 'up{job="loki"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 6m
        alertname: AlloyDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "No Alloy pod is up"
              description: "No Alloy pod is up, so pod logs are being lost. Check `kubectl -n nexus get pods -l app.kubernetes.io/name=alloy` and `kubectl -n nexus logs daemonset/alloy`."

  - name: AlloyDown is silent while at least one alloy pod is up
    input_series:
      - series: 'up{job="alloy",pod="alloy-a"}'
        values: '0x40'
      - series: 'up{job="alloy",pod="alloy-b"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: AlloyDown
        exp_alerts: []

  - name: LokiObjectStoreErrors fires on failing S3 requests
    input_series:
      - series: 'loki_s3_request_duration_seconds_count{status_code="403"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: LokiObjectStoreErrors
        exp_alerts: []
      - eval_time: 25m
        alertname: LokiObjectStoreErrors
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Loki object-store requests are failing"
              description: "Loki cannot write to or read from the Backblaze B2 bucket. This is usually an expired or revoked key or a B2 outage. Check the B2 key in Vault `secret/nexus/loki`, the `loki-s3` ExternalSecret, and `kubectl -n nexus logs statefulset/loki | grep -i s3`."

  - name: LokiObjectStoreErrors fires on failing chunk flushes
    input_series:
      - series: 'loki_ingester_chunks_flush_failures_total'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: LokiObjectStoreErrors
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Loki object-store requests are failing"
              description: "Loki cannot write to or read from the Backblaze B2 bucket. This is usually an expired or revoked key or a B2 outage. Check the B2 key in Vault `secret/nexus/loki`, the `loki-s3` ExternalSecret, and `kubectl -n nexus logs statefulset/loki | grep -i s3`."

  - name: LokiObjectStoreErrors is silent for 2xx, 404 and flat counters
    input_series:
      - series: 'loki_s3_request_duration_seconds_count{status_code="200"}'
        values: '0+5x40'
      - series: 'loki_s3_request_duration_seconds_count{status_code="404"}'
        values: '0+5x40'
      - series: 'loki_ingester_chunks_flush_failures_total'
        values: '3+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: LokiObjectStoreErrors
        exp_alerts: []

  - name: LokiChunksNotFlushing fires when logs arrive but nothing flushes for 3h
    input_series:
      - series: 'loki_distributor_lines_received_total'
        values: '0+100x300'
      - series: 'loki_ingester_chunks_flushed_total{reason="idle"}'
        values: '5+0x300'
      - series: 'process_start_time_seconds{job="loki"}'
        values: '0+0x300'
    alert_rule_test:
      - eval_time: 2h
        alertname: LokiChunksNotFlushing
        exp_alerts: []
      - eval_time: 4h
        alertname: LokiChunksNotFlushing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Loki has not flushed any chunk for 3h"
              description: "Loki is receiving logs but has flushed no chunk to B2 in 3 hours, so the WAL is filling the local disk (10Gi PVC). Check `kubectl -n nexus logs statefulset/loki | grep -i flush` and the B2 key in Vault `secret/nexus/loki`."

  - name: LokiChunksNotFlushing is silent while chunks flush
    input_series:
      - series: 'loki_distributor_lines_received_total'
        values: '0+100x300'
      - series: 'loki_ingester_chunks_flushed_total{reason="idle"}'
        values: '0+1x300'
      - series: 'process_start_time_seconds{job="loki"}'
        values: '0+0x300'
    alert_rule_test:
      - eval_time: 4h
        alertname: LokiChunksNotFlushing
        exp_alerts: []

  - name: LokiChunksNotFlushing is silent when no logs are received
    input_series:
      - series: 'loki_distributor_lines_received_total'
        values: '100+0x300'
      - series: 'loki_ingester_chunks_flushed_total{reason="idle"}'
        values: '5+0x300'
      - series: 'process_start_time_seconds{job="loki"}'
        values: '0+0x300'
    alert_rule_test:
      - eval_time: 4h
        alertname: LokiChunksNotFlushing
        exp_alerts: []

  - name: LokiChunksNotFlushing is silent in the first 3h after a Loki start
    input_series:
      - series: 'loki_distributor_lines_received_total'
        values: '0+100x300'
      - series: 'process_start_time_seconds{job="loki"}'
        values: '10800+0x300'
    alert_rule_test:
      - eval_time: 4h
        alertname: LokiChunksNotFlushing
        exp_alerts: []

  - name: LokiCompactorNotRunning fires when the last retention run is over 3h old
    input_series:
      - series: 'loki_compactor_apply_retention_last_successful_run_timestamp_seconds'
        values: '600+0x300'
      - series: 'process_start_time_seconds{job="loki"}'
        values: '0+0x300'
    alert_rule_test:
      - eval_time: 2h
        alertname: LokiCompactorNotRunning
        exp_alerts: []
      - eval_time: 4h
        alertname: LokiCompactorNotRunning
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Loki retention has not run for 3h"
              description: "The Loki compactor has not completed a retention run in over 3 hours, so expired logs are not deleted and B2 storage and cost grow without limit. Check `kubectl -n nexus logs statefulset/loki | grep -i compactor`."

  - name: LokiCompactorNotRunning is silent while retention runs
    input_series:
      - series: 'loki_compactor_apply_retention_last_successful_run_timestamp_seconds'
        values: '0+60x300'
      - series: 'process_start_time_seconds{job="loki"}'
        values: '0+0x300'
    alert_rule_test:
      - eval_time: 4h
        alertname: LokiCompactorNotRunning
        exp_alerts: []

  - name: LokiCompactorNotRunning is silent in the first 3h after a Loki start
    input_series:
      - series: 'loki_compactor_apply_retention_last_successful_run_timestamp_seconds'
        values: '0+0x300'
      - series: 'process_start_time_seconds{job="loki"}'
        values: '10800+0x300'
    alert_rule_test:
      - eval_time: 4h
        alertname: LokiCompactorNotRunning
        exp_alerts: []

  - name: AlloyLokiWriteFailing fires on dropped entries
    input_series:
      - series: 'loki_write_dropped_entries_total{reason="ingester_error"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: AlloyLokiWriteFailing
        exp_alerts: []
      - eval_time: 15m
        alertname: AlloyLokiWriteFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Alloy is failing to write logs to Loki"
              description: "Alloy is retrying or dropping log batches sent to Loki. Check `kubectl -n nexus logs daemonset/alloy` and that Loki is up (`kubectl -n nexus get pods -l app.kubernetes.io/name=loki`)."

  - name: AlloyLokiWriteFailing fires on batch retries
    input_series:
      - series: 'loki_write_batch_retries_total'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: AlloyLokiWriteFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Alloy is failing to write logs to Loki"
              description: "Alloy is retrying or dropping log batches sent to Loki. Check `kubectl -n nexus logs daemonset/alloy` and that Loki is up (`kubectl -n nexus get pods -l app.kubernetes.io/name=loki`)."

  - name: AlloyLokiWriteFailing is silent when nothing is dropped or retried
    input_series:
      - series: 'loki_write_dropped_entries_total{reason="ingester_error"}'
        values: '7+0x40'
      - series: 'loki_write_batch_retries_total'
        values: '2+0x40'
      - series: 'loki_write_sent_entries_total'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: AlloyLokiWriteFailing
        exp_alerts: []

  - name: LokiRequestRateLimited fires when limits discard samples
    input_series:
      - series: 'loki_discarded_samples_total{reason="per_stream_rate_limit",tenant="fake"}'
        values: '0+5x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: LokiRequestRateLimited
        exp_alerts: []
      - eval_time: 25m
        alertname: LokiRequestRateLimited
        exp_alerts:
          - exp_labels:
              reason: per_stream_rate_limit
              severity: warning
            exp_annotations:
              summary: "Loki is dropping logs (per_stream_rate_limit)"
              description: "Loki is discarding log lines because of its limits (per_stream_rate_limit). Find the noisy stream in Grafana Explore (Loki) and either quieten it or raise the limit in infra/charts/nexus/loki/values.yaml."

  - name: LokiRequestRateLimited is silent for other reasons and flat counters
    input_series:
      - series: 'loki_discarded_samples_total{reason="invalid_labels",tenant="fake"}'
        values: '0+5x60'
      - series: 'loki_discarded_samples_total{reason="rate_limited",tenant="fake"}'
        values: '4+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: LokiRequestRateLimited
        exp_alerts: []

  # ── NordicSlackPostsFailing: any failed Slack post in 30m ───────────────
  - name: Slack failures fire, then clear
    input_series:
      - series: 'nordic_slack_posts_total{result="failed"}'
        values: '0+0x4 1+0x60'
      - series: 'nordic_slack_posts_total{result="posted"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 3m
        alertname: NordicSlackPostsFailing
        exp_alerts: []
      - eval_time: 10m
        alertname: NordicSlackPostsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "nordic-live failed to post to Slack"
              description: "nordic-live failed to post 1 results release(s) to Slack in the last 30 minutes. See `slack post failed` in the nordic-live logs for the Slack error code."
      - eval_time: 50m # the failure has left the 30m window
        alertname: NordicSlackPostsFailing
        exp_alerts: []

  - name: Successful Slack posts alone never alert
    input_series:
      - series: 'nordic_slack_posts_total{result="failed"}'
        values: '0+0x60'
      - series: 'nordic_slack_posts_total{result="posted"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: NordicSlackPostsFailing
        exp_alerts: []

