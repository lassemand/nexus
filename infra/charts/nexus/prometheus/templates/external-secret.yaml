# ExternalSecret — pulls the Alertmanager Slack incoming webhook URL from Vault.
# The resulting secret is mounted into the Alertmanager pod (alertmanagerSpec.secrets)
# and read through api_url_file, so the config never contains the raw URL.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: nexus
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: nexus-secret-store
    kind: ClusterSecretStore
  target:
    name: alertmanager-slack
    creationPolicy: Owner
  data:
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: nexus/alertmanager
        property: SLACK_WEBHOOK_URL
