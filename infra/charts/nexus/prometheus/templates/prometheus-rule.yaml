# nexus alert groups. The single source is rules/nexus.rules.yml, a plain
# Prometheus rule file that is also what `promtool test rules` runs against
# (rules/nexus.rules.test.yml). Parsed with fromYaml so the Prometheus
# templates in annotations are never seen by Helm's template engine.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nexus-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: nexus
spec:
{{ .Files.Get "rules/nexus.rules.yml" | fromYaml | toYaml | indent 2 }}
