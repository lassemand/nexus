# ExternalSecret — renders Thanos' objstore.yml from the Backblaze B2
# application key in Vault (secret/nexus/thanos). The same Secret
# (thanos-objstore, key objstore.yml) is used by the Thanos components in this
# chart and by the Prometheus sidecar (prometheus chart, thanos.objectStorageConfig).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: thanos-objstore
  namespace: nexus
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: nexus-secret-store
    kind: ClusterSecretStore
  target:
    name: thanos-objstore
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        objstore.yml: |
          type: S3
          config:
            bucket: nexus-metrics
            endpoint: s3.eu-central-003.backblazeb2.com
            region: eu-central-003
            access_key: {{ "{{ .accessKey }}" }}
            secret_key: {{ "{{ .secretKey }}" }}
  data:
    - secretKey: accessKey
      remoteRef:
        key: nexus/thanos
        property: AWS_ACCESS_KEY_ID
    - secretKey: secretKey
      remoteRef:
        key: nexus/thanos
        property: AWS_SECRET_ACCESS_KEY
