# Kafka cluster — Strimzi KRaft mode, KafkaNodePool-based.
#
# Bootstrap address (internal ClusterIP):
#   nexus-kafka-bootstrap.nexus.svc.cluster.local:9092
#
# External bootstrap (LoadBalancer, host access):
#   kubectl get svc -n nexus nexus-kafka-external-bootstrap \
#     -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
#
# sync-wave 1: applied after the Strimzi operator (wave 0) has registered CRDs.
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: nexus
  namespace: nexus
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
    argocd.argoproj.io/sync-wave: "1"
spec:
  kafka:
    version: 4.1.0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      # External LoadBalancer listener — Strimzi auto-detects the assigned IP
      # and sets the advertised address. No hardcoded nodePort or advertisedHost.
      #
      # Both Services are pinned to the addresses they already had. MetalLB
      # does not keep unpinned assignments across a VM restart, and host
      # clients hold the bootstrap IP in KAFKA_BROKERS — after one restart it
      # pointed at what is now argocd-server's .11 and `nexus register` timed
      # out. Same mechanism as argocd-server (.11) and grafana (.12).
      - name: external
        port: 9093
        type: loadbalancer
        tls: false
        configuration:
          bootstrap:
            annotations:
              metallb.universe.tf/loadBalancerIPs: 192.168.139.10
          brokers:
            - broker: 0
              annotations:
                metallb.universe.tf/loadBalancerIPs: 192.168.139.13
    config:
      offsets.topic.replication.factor: "1"
      transaction.state.log.replication.factor: "1"
      transaction.state.log.min.isr: "1"
      default.replication.factor: "1"
      min.insync.replicas: "1"
    readinessProbe:
      initialDelaySeconds: 15
      timeoutSeconds: 5
    livenessProbe:
      initialDelaySeconds: 15
      timeoutSeconds: 5
  # Kafka Exporter: kafka_consumergroup_lag{consumergroup,topic,partition} and
  # related metrics for every group and topic. Scraped by kafka-exporter-podmonitor.yaml.
  kafkaExporter:
    groupRegex: ".*"
    topicRegex: ".*"
  entityOperator:
    topicOperator: {}
    userOperator: {}
