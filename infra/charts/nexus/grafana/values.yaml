grafana:
  service:
    type: LoadBalancer
    annotations:
      # Pinned to the address it already had, so nothing moves today. MetalLB
      # does not keep LoadBalancer assignments across a VM restart — grafana
      # itself went .15 -> .12 in one — so an SSH forward to an unpinned IP
      # silently starts pointing at another service. Same mechanism as
      # argocd-server's pin in infra/argocd/overlays/orbstack/.
      metallb.universe.tf/loadBalancerIPs: 192.168.139.12

  persistence:
    enabled: false

  # Admin credentials sourced from Vault via grafana-secret ExternalSecret.
  # Using existingSecret prevents the helm chart from generating a random
  # admin password on each install/restart.
  admin:
    existingSecret: grafana-secret
    userKey: GF_SECURITY_ADMIN_USER
    passwordKey: GF_SECURITY_ADMIN_PASSWORD

  envFromSecret: grafana-secret

  datasources:
    datasources.yaml:
      apiVersion: 1
      # Nexus Chronicle served the Event Log's report query until reports were
      # published as special events (NEX-171). Drop the provisioned copy.
      deleteDatasources:
        - name: Nexus Chronicle
          orgId: 1
      datasources:
        - name: Prometheus
          uid: nexus-prometheus
          type: prometheus
          url: http://prometheus-kube-prometheus-prometheus.nexus.svc.cluster.local:9090
          isDefault: true
          editable: false

        # Thanos Query: local Prometheus data plus B2 history up to 90 days
        # (docs/guides/metrics-longterm.md). Not the default yet.
        - name: Thanos
          uid: nexus-thanos
          type: prometheus
          url: http://thanos-query.nexus.svc.cluster.local:10902
          editable: false

        - name: Nexus Postgres
          uid: nexus-postgres
          type: grafana-postgresql-datasource
          url: nexus-postgres.nexus.svc.cluster.local:5432
          user: nexus
          secureJsonData:
            password: ${GF_DATABASE_PASSWORD}
          jsonData:
            database: backtest
            sslmode: require
            timescaledb: false
          editable: false

        - name: Loki
          uid: nexus-loki
          type: loki
          url: http://loki.nexus.svc.cluster.local:3100
          editable: false
          jsonData:
            maxLines: 1000
            derivedFields:
              # Matches the JSON field the services log: "trace_id":"<32 hex>".
              - name: trace_id
                datasourceUid: nexus-tempo
                matcherRegex: '"trace_id":"([0-9a-f]{32})"'
                url: "$${__value.raw}"
                urlDisplayLabel: View trace

        - name: Tempo
          uid: nexus-tempo
          type: tempo
          url: http://tempo.nexus.svc.cluster.local:3200
          editable: false
          jsonData:
            tracesToLogsV2:
              datasourceUid: nexus-loki
              spanStartTimeShift: -5m
              spanEndTimeShift: 5m
              filterByTraceID: false
              filterBySpanID: false
              customQuery: true
              query: '{namespace=~".+"} | json | trace_id="$${__trace.traceId}"'
            tracesToMetrics:
              datasourceUid: nexus-prometheus
              spanStartTimeShift: -5m
              spanEndTimeShift: 5m
              queries:
                - name: Span rate
                  query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))'
                - name: Span duration p95
                  query: 'histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])))'
              tags:
                - key: service.name
                  value: service
                - key: span.name
                  value: span_name
            serviceMap:
              datasourceUid: nexus-prometheus
            nodeGraph:
              enabled: true
            search:
              hide: false
            traceQuery:
              timeShiftEnabled: true
              spanStartTimeShift: -5m
              spanEndTimeShift: 5m

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      # ConfigMaps pick their folder with this annotation: "Nexus" for ours
      # (templates/dashboard-*.yaml), "Kubernetes" for the kube-prometheus-stack
      # ones (annotation set in infra/charts/nexus/prometheus/values.yaml).
      folderAnnotation: grafana_folder
      provider:
        # Required for folderAnnotation to take effect.
        foldersFromFilesStructure: true
        # Dashboards are code: edit the ConfigMap, not the UI.
        allowUiUpdates: false

  # Scrape Grafana itself, which feeds the kube-prometheus-stack "Grafana
  # Overview" dashboard. Picked up by Prometheus because its monitor selectors
  # are open (serviceMonitorSelectorNilUsesHelmValues: false).
  serviceMonitor:
    enabled: true
