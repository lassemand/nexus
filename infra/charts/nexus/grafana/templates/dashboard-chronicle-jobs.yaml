apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-chronicle-jobs
  namespace: nexus
  annotations:
    # Folder in Grafana (sidecar folderAnnotation, see values.yaml).
    grafana_folder: Nexus
  labels:
    grafana_dashboard: "1"
data:
  chronicle-jobs.json: |
    {
      "uid": "nexus-chronicle-jobs",
      "title": "Chronicle Jobs",
      "tags": [
        "nexus",
        "chronicle",
        "cronjobs"
      ],
      "timezone": "browser",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "refresh": "5m",
      "schemaVersion": 39,
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "table",
          "title": "Jobs (last run)",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "nexus-prometheus"
          },
          "description": "One row per job, from the metrics each run pushes. Age / threshold: 1 = the staleness alert limit (30 h daily jobs, 78 h weekday jobs). Main count: chronicle/market/earnings/filings items fetched (filings, bars, earnings records, Form 4 filings), pdmr rows, nordic-reports feed items seen, nordic-calendar upcoming reports.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last run"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeAsLocal"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last success"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeAsLocal"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Age of last success"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Age / threshold"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 0.8
                        },
                        {
                          "color": "red",
                          "value": 1
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Duration"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last run ok"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "failed",
                            "color": "red"
                          },
                          "1": {
                            "text": "ok",
                            "color": "green"
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Main count"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "none"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Job",
                "desc": false
              }
            ]
          },
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value #A": "Last run",
                  "Value #B": "Last success",
                  "Value #C": "Age of last success",
                  "Value #D": "Age / threshold",
                  "Value #E": "Duration",
                  "Value #F": "Last run ok",
                  "Value #G": "Main count",
                  "job": "Job"
                },
                "indexByName": {
                  "job": 0,
                  "Value #A": 1,
                  "Value #B": 2,
                  "Value #C": 3,
                  "Value #D": 4,
                  "Value #E": 5,
                  "Value #F": 6,
                  "Value #G": 7
                }
              }
            }
          ],
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "nexus-prometheus"
              },
              "expr": "max by (job) (nexus_job_last_run_timestamp_seconds{job=~\"chronicle|earnings|nordic-reports|nordic-calendar|market|filings|pdmr\"}) * 1000",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "nexus-prometheus"
              },
              "expr": "max by (job) (nexus_job_last_success_timestamp_seconds{job=~\"chronicle|earnings|nordic-reports|nordic-calendar|market|filings|pdmr\"}) * 1000",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "nexus-prometheus"
              },
              "expr": "max by (job) (time() - nexus_job_last_success_timestamp_seconds{job=~\"chronicle|earnings|nordic-reports|nordic-calendar\"}) or max by (job) (time() - nexus_job_last_success_timestamp_seconds{job=~\"market|filings|pdmr\"})",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "nexus-prometheus"
              },
              "expr": "max by (job) ((time() - nexus_job_last_success_timestamp_seconds{job=~\"chronicle|earnings|nordic-reports|nordic-calendar\"}) / (30 * 3600)) or max by (job) ((time() - nexus_job_last_success_timestamp_seconds{job=~\"market|filings|pdmr\"}) / (78 * 3600))",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "E",
              "datasource": {
                "type": "prometheus",
                "uid": "nexus-prometheus"
              },
              "expr": "max by (job) (nexus_job_duration_seconds{job=~\"chronicle|earnings|nordic-reports|nordic-calendar|market|filings|pdmr\"})",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "F",
              "datasource": {
                "type": "prometheus",
                "uid": "nexus-prometheus"
              },
              "expr": "max by (job) (nexus_job_last_run_success{job=~\"chronicle|earnings|nordic-reports|nordic-calendar|market|filings|pdmr\"})",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "G",
              "datasource": {
                "type": "prometheus",
                "uid": "nexus-prometheus"
              },
              "expr": "sum by (job) (chronicle_items_fetched_total{job=\"chronicle\"} or market_items_fetched_total{job=\"market\"} or earnings_items_fetched_total{job=\"earnings\"} or filings_items_fetched_total{job=\"filings\"} or pdmr_rows_fetched_total{job=\"pdmr\"} or nordic_reports_items_seen_total{job=\"nordic-reports\"} or nordic_calendar_upcoming_reports{job=\"nordic-calendar\"})",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ]
        },
