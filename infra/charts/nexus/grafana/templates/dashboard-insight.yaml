apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-insight
  namespace: nexus
  annotations:
    grafana_folder: Nexus
  labels:
    grafana_dashboard: "1"
data:
  insight.json: |
    {
      "uid": "nexus-insight",
      "title": "Insight",
      "tags": [
        "nexus",
        "insight"
      ],
      "timezone": "browser",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "schemaVersion": 39,
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Calls per tool (per second)",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "nexus-prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "nexus-prometheus"
              },
              "expr": "sum by (tool) (rate(insight_tool_calls_total{job=\"insight\"}[$__rate_interval]))",
              "legendFormat": "{{ "{{" }}tool{{ "}}" }}"
            }
          ],
          "description": ""
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Error ratio per tool",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "nexus-prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "nexus-prometheus"
              },
              "expr": "sum by (tool) (rate(insight_tool_calls_total{job=\"insight\",outcome!=\"ok\"}[$__rate_interval])) / sum by (tool) (rate(insight_tool_calls_total{job=\"insight\"}[$__rate_interval]))",
              "legendFormat": "{{ "{{" }}tool{{ "}}" }}"
            }
          ],
          "description": "Share of calls that ended in error or invalid_params."
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latency p50 / p95 per tool",
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "nexus-prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "nexus-prometheus"
              },
              "expr": "histogram_quantile(0.5, sum by (tool, le) (rate(insight_tool_duration_seconds_bucket{job=\"insight\"}[$__rate_interval])))",
              "legendFormat": "{{ "{{" }}tool{{ "}}" }} p50"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "nexus-prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (tool, le) (rate(insight_tool_duration_seconds_bucket{job=\"insight\"}[$__rate_interval])))",
              "legendFormat": "{{ "{{" }}tool{{ "}}" }} p95"
            }
          ],
          "description": ""
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Rows returned (p95 per tool)",
          "gridPos": {
            "x": 12,
            "y": 7,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "nexus-prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "nexus-prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (tool, le) (rate(insight_tool_result_rows_bucket{job=\"insight\"}[$__rate_interval])))",
              "legendFormat": "{{ "{{" }}tool{{ "}}" }}"
            }
          ],
          "description": "Large values mean a tool sends a big payload to the LLM."
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "SSE sessions",
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "nexus-prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "nexus-prometheus"
              },
              "expr": "insight_sse_sessions{job=\"insight\"}",
              "legendFormat": "open sessions"
            }
          ],
          "description": "Open SSE connections."
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Pod restarts (per hour)",
          "gridPos": {
            "x": 12,
            "y": 14,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "nexus-prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "nexus-prometheus"
              },
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"insight\"}[1h]))",
              "legendFormat": "{{ "{{" }}pod{{ "}}" }}"
            }
          ],
          "description": ""
        }
      ]
    }
