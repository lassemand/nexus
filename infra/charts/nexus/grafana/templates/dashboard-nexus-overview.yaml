apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-nexus-overview
  namespace: nexus
  annotations:
    # Folder in Grafana (sidecar folderAnnotation, see values.yaml).
    grafana_folder: Nexus
  labels:
    grafana_dashboard: "1"
data:
  nexus-overview.json: |
    {
      "uid": "nexus-overview",
      "title": "Nexus Overview",
      "tags": [
        "nexus"
      ],
      "timezone": "browser",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "1m",
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1,
          "type": "table",
          "title": "Scraped services",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "nexus-prometheus"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Up"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "DOWN",
                            "color": "red",
                            "index": 0
                          },
                          "1": {
                            "text": "UP",
                            "color": "green",
                            "index": 1
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "red",
                          "value": null
                        },
                        {
                          "color": "green",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Info"
                },
                "properties": []
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "nexus-prometheus"
              },
              "expr": "max by (job, namespace) (up{namespace=~\"signal|chronicle|insight|conductor|nexus\"})",
              "legendFormat": "__auto",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "nexus-prometheus"
              },
              "expr": "max by (job, version) (nexus_build_info)",
              "legendFormat": "__auto",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "job",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time 1": true,
                  "Time 2": true
                },
                "renameByName": {
                  "Value #A": "Up",
                  "Value #B": "Info",
                  "job": "Service",
                  "namespace": "Namespace",
                  "version": "Version"
                },
                "indexByName": {
                  "job": 0,
                  "namespace": 1,
                  "version": 2,
                  "Value #A": 3
                }
              }
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Container restarts (per hour)",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 24,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "nexus-prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "nexus-prometheus"
              },
              "expr": "sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace=~\"signal|chronicle|insight|conductor|nexus\"}[1h])) > 0",
              "legendFormat": "__auto"
            }
          ]
        },
        {
          "id": 3,
          "type": "table",
          "title": "Pushed jobs (last run)",
          "gridPos": {
            "x": 0,
            "y": 15,
            "w": 24,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "nexus-prometheus"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last run"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeFromNow"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last success (age)"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last run result"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "FAILED",
                            "color": "red",
                            "index": 0
                          },
                          "1": {
                            "text": "OK",
                            "color": "green",
                            "index": 1
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "red",
                          "value": null
                        },
                        {
                          "color": "green",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Duration"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Job"
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "nexus-prometheus"
              },
              "expr": "max by (job) (nexus_job_last_run_timestamp_seconds) * 1000",
              "legendFormat": "__auto",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "nexus-prometheus"
              },
              "expr": "time() - max by (job) (nexus_job_last_success_timestamp_seconds)",
              "legendFormat": "__auto",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "nexus-prometheus"
              },
              "expr": "max by (job) (nexus_job_last_run_success)",
              "legendFormat": "__auto",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "nexus-prometheus"
              },
              "expr": "max by (job) (nexus_job_duration_seconds)",
              "legendFormat": "__auto",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "job",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "Time 4": true
                },
                "renameByName": {
                  "job": "Job",
                  "Value #A": "Last run",
                  "Value #B": "Last success (age)",
                  "Value #C": "Last run result",
                  "Value #D": "Duration"
                },
                "indexByName": {
                  "job": 0,
                  "Value #A": 1,
                  "Value #B": 2,
                  "Value #C": 3,
                  "Value #D": 4
                }
              }
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Kafka consumer lag by group",
          "gridPos": {
            "x": 0,
            "y": 23,
            "w": 24,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "nexus-prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "nexus-prometheus"
              },
              "expr": "sum by (consumergroup) (kafka_consumergroup_lag)",
              "legendFormat": "__auto"
            }
          ]
        }
      ]
    }
