apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-special-events
  namespace: nexus
  annotations:
    # Folder in Grafana (sidecar folderAnnotation, see values.yaml).
    grafana_folder: Nexus
  labels:
    grafana_dashboard: "1"
data:
  special-events.json: |
    {
      "uid": "nexus-special-events",
      "title": "Special Events",
      "tags": ["nexus"],
      "timezone": "browser",
      "time": { "from": "now-10y", "to": "now" },
      "refresh": "5m",
      "schemaVersion": 39,
      "panels": [
        {
          "id": 2,
          "type": "table",
          "title": "Event Log",
          "description": "Special events, plus Nordic quarterly and annual reports: status upcoming (always listed, even past the end of the time range), occurred (past reports and events), or expected, not seen (scheduled reports that never appeared). Report times without a release are MFN estimates.",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 14 },
          "datasource": { "type": "datasource", "uid": "-- Mixed --" },
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "status" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } },
                  {
                    "id": "mappings",
                    "value": [
                      { "type": "value", "options": {
                        "upcoming":           { "color": "blue",   "index": 0 },
                        "occurred":           { "color": "text",   "index": 1 },
                        "expected, not seen": { "color": "orange", "index": 2 }
                      } }
                    ]
                  }
                ]
              }
            ]
          },
          "options": {
            "sortBy": [{ "displayName": "time", "desc": true }]
          },
          "transformations": [{ "id": "merge", "options": {} }],
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "grafana-postgresql-datasource", "uid": "nexus-postgres" },
              "format": "table",
              "rawSql": "SELECT occurred_at AS time, ticker, event_type, 'occurred' AS status, description\nFROM special_events\nWHERE $__timeFilter(occurred_at)"
            },
            {
              "refId": "B",
              "datasource": { "type": "grafana-postgresql-datasource", "uid": "nexus-chronicle" },
              "format": "table",
              "rawSql": "-- Nordic periodic reports: upcoming (always shown, past the range end),\n-- occurred, and scheduled-but-not-seen. expected_date/expected_time are\n-- Europe/Stockholm local, and expected_time is MFN's estimate.\nSELECT\n  COALESCE(r.occurred_at,\n           (r.expected_date + COALESCE(r.expected_time, TIME '00:00')) AT TIME ZONE 'Europe/Stockholm') AS time,\n  r.ticker,\n  CASE r.report_kind WHEN 'annual' THEN 'annual report' ELSE 'quarterly report' END AS event_type,\n  CASE\n    WHEN r.occurred_at IS NOT NULL THEN 'occurred'\n    WHEN r.expected_date >= (NOW() AT TIME ZONE 'Europe/Stockholm')::date THEN 'upcoming'\n    ELSE 'expected, not seen'\n  END AS status,\n  concat_ws(' · ',\n    r.fiscal_period,\n    COALESCE(r.headline, r.calendar_label),\n    CASE WHEN r.occurred_at IS NULL AND r.expected_time IS NOT NULL\n         THEN 'time ' || to_char(r.expected_time, 'HH24:MI') || ' (estimated)' END) AS description\nFROM report_releases r\nWHERE r.report_kind IS NOT NULL\n  AND NOT r.is_correction\n  AND (\n    (r.occurred_at IS NULL AND r.expected_date >= (NOW() AT TIME ZONE 'Europe/Stockholm')::date)\n    OR $__timeFilter(COALESCE(r.occurred_at, r.expected_date::timestamptz))\n  )"
            }
          ]
        },
        {
          "id": 3,
          "type": "table",
          "title": "Insider Filings",
          "gridPos": { "x": 0, "y": 14, "w": 24, "h": 14 },
          "datasource": { "type": "grafana-postgresql-datasource", "uid": "nexus-postgres" },
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "direction" },
                "properties": [
                  {
                    "id": "custom.displayMode",
                    "value": "color-text"
                  },
                  {
                    "id": "mappings",
                    "value": [
                      { "type": "value", "options": { "Buy":  { "color": "green", "index": 0 } } },
                      { "type": "value", "options": { "Sell": { "color": "red",   "index": 1 } } }
                    ]
                  }
                ]
              }
            ]
          },
          "options": {
            "sortBy": [{ "displayName": "transaction_date", "desc": true }]
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "grafana-postgresql-datasource", "uid": "nexus-postgres" },
              "format": "table",
              "rawSql": "SELECT p.filer_name, p.filer_cik, f.filer_role, f.ticker, f.transaction_date,\n  CASE WHEN f.transaction_code = 'P' THEN 'Buy' ELSE 'Sell' END AS direction,\n  f.shares, f.price_per_share, f.shares * f.price_per_share AS total_value\nFROM insider_filings f\nJOIN persons p ON p.id = f.person_id\nORDER BY f.transaction_date DESC\nLIMIT 200"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Daily Insider Buy vs Sell Volume (90 days)",
          "gridPos": { "x": 0, "y": 28, "w": 24, "h": 10 },
          "datasource": { "type": "grafana-postgresql-datasource", "uid": "nexus-postgres" },
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "grafana-postgresql-datasource", "uid": "nexus-postgres" },
              "format": "time_series",
              "rawSql": "SELECT transaction_date AS time,\n  CASE WHEN transaction_code = 'P' THEN 'Buy' ELSE 'Sell' END AS direction,\n  SUM(shares * price_per_share) AS total_value\nFROM insider_filings\nWHERE transaction_date >= NOW() - INTERVAL '90 days'\n  AND transaction_code IN ('P', 'S')\nGROUP BY transaction_date, transaction_code\nORDER BY transaction_date"
            }
          ]
        },
        {
          "id": 5,
          "type": "table",
          "title": "Ticker Insider Consistency",
          "gridPos": { "x": 0, "y": 38, "w": 24, "h": 14 },
          "datasource": { "type": "grafana-postgresql-datasource", "uid": "nexus-postgres" },
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "consistency_score" },
                "properties": [{ "id": "custom.displayMode", "value": "color-background" },
                  { "id": "thresholds", "value": { "mode": "absolute", "steps": [
                    { "color": "green", "value": null },
                    { "color": "yellow", "value": 0.5 },
                    { "color": "red", "value": 1.0 }
                  ]}}]
              },
              {
                "matcher": { "id": "byName", "options": "move_rate" },
                "properties": [{ "id": "custom.displayMode", "value": "color-text" },
                  { "id": "thresholds", "value": { "mode": "absolute", "steps": [
                    { "color": "green", "value": null },
                    { "color": "yellow", "value": 0.5 },
                    { "color": "red", "value": 0.8 }
                  ]}}]
              },
              {
                "matcher": { "id": "byName", "options": "insider_purchase_rate" },
                "properties": [{ "id": "custom.displayMode", "value": "color-text" },
                  { "id": "thresholds", "value": { "mode": "absolute", "steps": [
                    { "color": "green", "value": null },
                    { "color": "yellow", "value": 0.3 },
                    { "color": "red", "value": 0.6 }
                  ]}}]
              }
            ]
          },
          "options": { "sortBy": [{ "displayName": "consistency_score", "desc": true }] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "grafana-postgresql-datasource", "uid": "nexus-postgres" },
              "format": "table",
              "rawSql": "SELECT ticker, event_count, move_rate, avg_abvol_before_event,\n  avg_suspicion, insider_purchase_rate, consistency_score\nFROM ticker_event_consistency\nORDER BY consistency_score DESC\nLIMIT 50"
            }
          ]
        },
        {
          "id": 6,
          "type": "barchart",
          "title": "Top 20 Tickers by Consistency Score",
          "gridPos": { "x": 0, "y": 52, "w": 24, "h": 12 },
          "datasource": { "type": "grafana-postgresql-datasource", "uid": "nexus-postgres" },
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "options": {
            "xField": "ticker",
            "orientation": "horizontal",
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "grafana-postgresql-datasource", "uid": "nexus-postgres" },
              "format": "table",
              "rawSql": "SELECT ticker, consistency_score, move_rate, insider_purchase_rate\nFROM ticker_event_consistency\nORDER BY consistency_score DESC\nLIMIT 20"
            }
          ]
        }
      ]
    }
