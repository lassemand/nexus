apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-analyst-results
  namespace: nexus
  annotations:
    grafana_folder: Nexus
  labels:
    grafana_dashboard: "1"
data:
  analyst-results.json: |
    {
      "uid": "nexus-analyst-results",
      "title": "Analyst results",
      "description": "Simulated results of the analyst: gain per report, compounded gain, gain by holding time, processing time and coverage. Simulated, forward-only, per share, no fees, spread included, pre-open entries at the open, only closed trades count.",
      "tags": [
        "nexus",
        "analyst"
      ],
      "timezone": "browser",
      "time": {
        "from": "now-90d",
        "to": "now"
      },
      "refresh": "1m",
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "name": "ticker",
            "label": "Ticker",
            "type": "query",
            "datasource": {
              "type": "grafana-postgresql-datasource",
              "uid": "nexus-postgres"
            },
            "query": "SELECT DISTINCT ticker FROM simulated_trades ORDER BY 1",
            "definition": "SELECT DISTINCT ticker FROM simulated_trades ORDER BY 1",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": "'__all__'",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "exchange_mic",
            "label": "Exchange MIC",
            "type": "query",
            "datasource": {
              "type": "grafana-postgresql-datasource",
              "uid": "nexus-postgres"
            },
            "query": "SELECT DISTINCT exchange_mic FROM simulated_trades ORDER BY 1",
            "definition": "SELECT DISTINCT exchange_mic FROM simulated_trades ORDER BY 1",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": "'__all__'",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "include_shadow",
            "label": "Include shadow trades in gain per report",
            "type": "custom",
            "query": "false,true",
            "multi": false,
            "includeAll": false,
            "current": {
              "selected": true,
              "text": "false",
              "value": "false"
            },
            "options": [
              {
                "selected": true,
                "text": "false",
                "value": "false"
              },
              {
                "selected": false,
                "text": "true",
                "value": "true"
              }
            ]
          }
        ]
      },
      "links": [
        {
          "title": "Analyst (operations)",
          "type": "link",
          "url": "/d/nexus-analyst",
          "icon": "dashboard",
          "targetBlank": false
        }
      ],
      "panels": [
        {
          "type": "text",
          "title": "About these results",
          "description": "Read this first.",
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "targets": [],
          "id": 1,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 5
          },
          "options": {
            "mode": "markdown",
            "content": "**Simulated results of the analyst, per share.**\n- Simulated and forward-only: every row exists because the analyst decided live; nothing is backfilled.\n- Per share: a gain is `pnl_pct = (exit bid - entry ask) / entry ask * 100`; no fees, no position sizing.\n- The bid/ask spread is included: buy at the ask, sell at the bid.\n- Pre-open releases are bought at the open, so the gain is the move after the open.\n- Only `closed` trades count toward any gain; every other status is excluded and counted, never shown as 0 %.\n- Shadow trades (`no_buy`, `abstain`, `skipped_no_kernel`) were simulated but not bought: they are the comparison baseline.\n- Percentages in different currencies are comparable; the compounded curve assumes all money is reinvested in every trade, so overlapping trades make it optimistic.\n"
          }
        },
        {
          "type": "row",
          "title": "Results",
          "collapsed": false,
          "id": 2,
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Trades (closed, bought)",
          "description": "Closed `buy` trades with exit in the time range.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "nexus-postgres"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "nexus-postgres"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT count(*) AS trades FROM simulated_trades WHERE decision = 'buy' AND status = 'closed' AND pnl_pct > -100 AND $__timeFilter(exit_at) AND (ticker IN ($ticker) OR '__all__' IN ($ticker)) AND (exchange_mic IN ($exchange_mic) OR '__all__' IN ($exchange_mic))"
            }
          ],
          "id": 3,
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 3,
            "h": 4
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "type": "stat",
          "title": "Hit rate",
          "description": "Share of closed `buy` trades with pnl_pct > 0.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "nexus-postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "nexus-postgres"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT round(coalesce(avg((pnl_pct > 0)::int), 0) * 100, 1) AS hit_rate FROM simulated_trades WHERE decision = 'buy' AND status = 'closed' AND pnl_pct > -100 AND $__timeFilter(exit_at) AND (ticker IN ($ticker) OR '__all__' IN ($ticker)) AND (exchange_mic IN ($exchange_mic) OR '__all__' IN ($exchange_mic))"
            }
          ],
          "id": 4,
          "gridPos": {
            "x": 3,
            "y": 6,
            "w": 3,
            "h": 4
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "type": "stat",
          "title": "Mean gain",
          "description": "Mean pnl_pct of closed `buy` trades, per share, spread included.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "nexus-postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "nexus-postgres"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT round(avg(pnl_pct), 4) AS mean_pnl_pct FROM simulated_trades WHERE decision = 'buy' AND status = 'closed' AND pnl_pct > -100 AND $__timeFilter(exit_at) AND (ticker IN ($ticker) OR '__all__' IN ($ticker)) AND (exchange_mic IN ($exchange_mic) OR '__all__' IN ($exchange_mic))"
            }
          ],
          "id": 5,
          "gridPos": {
            "x": 6,
            "y": 6,
            "w": 3,
            "h": 4
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "type": "stat",
          "title": "Median gain",
          "description": "Median pnl_pct of closed `buy` trades.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "nexus-postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "nexus-postgres"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT round((percentile_cont(0.5) WITHIN GROUP (ORDER BY pnl_pct))::numeric, 4) AS median_pnl_pct FROM simulated_trades WHERE decision = 'buy' AND status = 'closed' AND pnl_pct > -100 AND $__timeFilter(exit_at) AND (ticker IN ($ticker) OR '__all__' IN ($ticker)) AND (exchange_mic IN ($exchange_mic) OR '__all__' IN ($exchange_mic))"
            }
          ],
          "id": 6,
          "gridPos": {
            "x": 9,
            "y": 6,
            "w": 3,
            "h": 4
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "type": "stat",
          "title": "Accumulated gain (compounded)",
          "description": "Compounded, as if all money were reinvested in each trade; overlapping trades make this optimistic. Closed `buy` trades.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "nexus-postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "nexus-postgres"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT round((exp(sum(ln(1 + pnl_pct / 100))) - 1) * 100, 4) AS compounded_pct FROM simulated_trades WHERE decision = 'buy' AND status = 'closed' AND pnl_pct > -100 AND $__timeFilter(exit_at) AND (ticker IN ($ticker) OR '__all__' IN ($ticker)) AND (exchange_mic IN ($exchange_mic) OR '__all__' IN ($exchange_mic))"
            }
          ],
          "id": 7,
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 4,
            "h": 4
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "type": "stat",
          "title": "Best trade",
          "description": "Highest pnl_pct of a closed `buy` trade.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "nexus-postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "nexus-postgres"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT max(pnl_pct) AS best_pct FROM simulated_trades WHERE decision = 'buy' AND status = 'closed' AND pnl_pct > -100 AND $__timeFilter(exit_at) AND (ticker IN ($ticker) OR '__all__' IN ($ticker)) AND (exchange_mic IN ($exchange_mic) OR '__all__' IN ($exchange_mic))"
            }
          ],
          "id": 8,
          "gridPos": {
            "x": 16,
            "y": 6,
            "w": 2,
            "h": 4
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "type": "stat",
          "title": "Worst trade",
          "description": "Lowest pnl_pct of a closed `buy` trade.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "nexus-postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "nexus-postgres"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT min(pnl_pct) AS worst_pct FROM simulated_trades WHERE decision = 'buy' AND status = 'closed' AND pnl_pct > -100 AND $__timeFilter(exit_at) AND (ticker IN ($ticker) OR '__all__' IN ($ticker)) AND (exchange_mic IN ($exchange_mic) OR '__all__' IN ($exchange_mic))"
            }
          ],
          "id": 9,
          "gridPos": {
            "x": 18,
            "y": 6,
            "w": 2,
            "h": 4
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "type": "stat",
          "title": "Excluded trades",
          "description": "Trades of any decision (shadow included) whose status is not `closed`, or whose pnl_pct is missing or <= -100. Never counted as 0 %. Filtered on the decision time like the table it links to (the publish time when the decision has not arrived). Click for the breakdown by status in the Coverage row.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "nexus-postgres"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "orange"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "nexus-postgres"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT count(*) AS excluded FROM simulated_trades t LEFT JOIN analyst_decisions d ON d.news_id = t.news_id WHERE (t.status <> 'closed' OR t.pnl_pct IS NULL OR t.pnl_pct <= -100) AND $__timeFilter(coalesce(d.decided_at, t.published_at)) AND (t.ticker IN ($ticker) OR '__all__' IN ($ticker)) AND (t.exchange_mic IN ($exchange_mic) OR '__all__' IN ($exchange_mic))"
            }
          ],
          "id": 10,
          "gridPos": {
            "x": 20,
            "y": 6,
            "w": 4,
            "h": 4
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "links": [
            {
              "title": "Excluded trades by status",
              "url": "/d/nexus-analyst-results?viewPanel=21&${__url_time_range}&${ticker:queryparam}&${exchange_mic:queryparam}"
            }
          ]
        },
        {
          "type": "barchart",
          "title": "Gain per report (%)",
          "description": "One bar per closed trade, labelled `<ticker> <report date>`, coloured by decision. pnl_pct per share, spread included. Shadow trades (decisions that were not bought) show only when the variable include_shadow is true.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "nexus-postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "buy"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "no_buy"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "abstain"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "skipped_no_kernel"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "purple"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "nexus-postgres"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT ticker || ' ' || (published_at AT TIME ZONE 'UTC')::date AS report, CASE WHEN decision = 'buy' THEN pnl_pct END AS buy, CASE WHEN decision = 'no_buy' THEN pnl_pct END AS no_buy, CASE WHEN decision = 'abstain' THEN pnl_pct END AS abstain, CASE WHEN decision = 'skipped_no_kernel' THEN pnl_pct END AS skipped_no_kernel FROM simulated_trades WHERE status = 'closed' AND pnl_pct > -100 AND $__timeFilter(exit_at) AND (ticker IN ($ticker) OR '__all__' IN ($ticker)) AND (exchange_mic IN ($exchange_mic) OR '__all__' IN ($exchange_mic)) AND (shadow = false OR $include_shadow) ORDER BY exit_at, trade_id"
            }
          ],
          "id": 11,
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 24,
            "h": 9
          },
          "options": {
            "xField": "report",
            "stacking": "normal",
            "showValue": "never",
            "xTickLabelRotation": -45,
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "type": "table",
          "title": "Closed trades",
          "description": "One row per closed trade (excluded trades are listed in the Coverage row). Time held is shown in seconds. pnl_pct per share. Open trace links to Tempo.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "nexus-postgres"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "trace_id"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Open trace",
                        "url": "/explore?left=%7B%22datasource%22:%22nexus-tempo%22,%22queries%22:%5B%7B%22refId%22:%22A%22,%22queryType%22:%22traceql%22,%22query%22:%22${__value.raw}%22%7D%5D%7D"
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "time_held"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "pnl_pct"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percent"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "nexus-postgres"
              },
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT exit_at AS time, ticker, exchange_mic AS mic, decision, shadow, entry_at, entry_ask, exit_at, exit_bid, extract(epoch FROM (exit_at - entry_at)) AS time_held, pnl_pct, status, trace_id FROM simulated_trades WHERE status = 'closed' AND pnl_pct > -100 AND $__timeFilter(exit_at) AND (ticker IN ($ticker) OR '__all__' IN ($ticker)) AND (exchange_mic IN ($exchange_mic) OR '__all__' IN ($exchange_mic)) AND (shadow = false OR $include_shadow) ORDER BY exit_at DESC, trade_id DESC LIMIT 500"
            }
          ],
          "id": 12,
          "gridPos": {
            "x": 0,
            "y": 19,
            "w": 24,
            "h": 9
          }
        },
        {
          "type": "timeseries",
          "title": "Accumulated relative gain (compounded)",
          "description": "Compounded, as if all money were reinvested in each trade; overlapping trades make this optimistic. Each line chains closed trades in exit order, starting from the first trade in the time range: exp(sum(ln(1 + pnl_pct/100))) - 1, in %. Strategy = closed buy trades; Buy every report = all closed trades, shadow and not; Not bought = closed no_buy shadow trades.",
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "nexus-postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "stepAfter",
                "spanNulls": true,
                "showPoints": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Strategy"
                },
