apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-nordic-reports
  namespace: nexus
  annotations:
    # Folder in Grafana (sidecar folderAnnotation, see values.yaml).
    grafana_folder: Nexus
  labels:
    grafana_dashboard: "1"
data:
  nordic-reports.json: |
    {
      "uid": "nexus-nordic-reports",
      "title": "Nordic Reports",
      "tags": [
        "nexus",
        "nordic"
      ],
      "timezone": "browser",
      "time": {
        "from": "now-10y",
        "to": "now+1y"
      },
      "refresh": "5m",
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "name": "company",
            "label": "Company",
            "type": "query",
            "datasource": {
              "type": "grafana-postgresql-datasource",
              "uid": "nexus-postgres"
            },
            "query": "-- One option per company that has Nordic reports. The text is the company's display name\n-- (already \"Name (TICKER)\" in the registry); the value is \"TICKER|MIC\".\nSELECT\n  CASE\n    WHEN n.name IS NULL THEN n.ticker\n    WHEN n.name LIKE '%(' || n.ticker || ')' THEN n.name\n    ELSE n.name || ' (' || n.ticker || ')'\n  END AS __text,\n  n.ticker || '|' || n.exchange_mic AS __value\nFROM (\n  SELECT ticker, exchange_mic, max(company_name) AS name\n  FROM special_events\n  WHERE source = 'mfn'\n  GROUP BY ticker, exchange_mic\n) n\nORDER BY 1",
            "definition": "-- One option per company that has Nordic reports. The text is the company's display name\n-- (already \"Name (TICKER)\" in the registry); the value is \"TICKER|MIC\".\nSELECT\n  CASE\n    WHEN n.name IS NULL THEN n.ticker\n    WHEN n.name LIKE '%(' || n.ticker || ')' THEN n.name\n    ELSE n.name || ' (' || n.ticker || ')'\n  END AS __text,\n  n.ticker || '|' || n.exchange_mic AS __value\nFROM (\n  SELECT ticker, exchange_mic, max(company_name) AS name\n  FROM special_events\n  WHERE source = 'mfn'\n  GROUP BY ticker, exchange_mic\n) n\nORDER BY 1",
            "refresh": 1,
            "sort": 0,
            "multi": false,
            "includeAll": false,
            "hide": 0,
            "current": {},
            "options": [],
            "regex": ""
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "table",
          "title": "Upcoming reports",
          "description": "Scheduled report dates from the company's MFN financial calendar, soonest first. The time is MFN's estimate (the previous report's time); \"not announced\" when MFN lists none.",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 14,
            "h": 8
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "nexus-postgres"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "nexus-postgres"
              },
              "format": "table",
              "rawSql": "-- Scheduled reports from today (Stockholm) on. expected_time is MFN's estimate; when MFN\n-- shows no time it is NULL and we say so instead of showing 00:00.\nWITH up AS (\n  SELECT\n    to_char(expected_date, 'YYYY-MM-DD') AS \"Date\",\n    COALESCE(to_char(expected_time, 'HH24:MI'), 'not announced') AS \"Est. time (estimated)\",\n    calendar_label AS \"Report\",\n    report_kind AS \"Kind\",\n    fiscal_period AS \"Fiscal period\"\n  FROM special_events\n  WHERE source = 'mfn' AND event_type IN ('quarterly_report', 'annual_report') AND status = 'scheduled'\n    AND ticker = split_part(${company:sqlstring}, '|', 1) AND exchange_mic = split_part(${company:sqlstring}, '|', 2)\n    AND expected_date >= (now() AT TIME ZONE 'Europe/Stockholm')::date\n)\nSELECT * FROM up\nUNION ALL\nSELECT 'No upcoming report dates published', NULL, NULL, NULL, NULL\nWHERE NOT EXISTS (SELECT 1 FROM up)\nORDER BY 1, 2"
            }
          ]
        },
        {
          "id": 2,
          "type": "table",
          "title": "Release timing",
          "description": "When the company's past reports came out relative to the Stockholm session (open 09:00, close 17:30, 13:00 on half days).",
          "gridPos": {
            "x": 14,
            "y": 0,
            "w": 10,
            "h": 8
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "nexus-postgres"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "nexus-postgres"
              },
              "format": "table",
              "rawSql": "-- How the company's past reports were timed relative to the Stockholm session.\nSELECT\n  CASE release_session\n    WHEN 'pre_open' THEN 'pre-open'\n    WHEN 'intraday' THEN 'intraday'\n    WHEN 'after_close' THEN 'after close'\n    WHEN 'non_trading_day' THEN 'non-trading day'\n    ELSE 'not classified'\n  END AS \"Session\",\n  count(*) AS \"Reports\"\nFROM special_events\nWHERE source = 'mfn' AND event_type IN ('quarterly_report', 'annual_report') AND status = 'occurred' AND NOT is_correction\n  AND ticker = split_part(${company:sqlstring}, '|', 1) AND exchange_mic = split_part(${company:sqlstring}, '|', 2)\nGROUP BY release_session\nORDER BY min(CASE release_session\n  WHEN 'pre_open' THEN 1 WHEN 'intraday' THEN 2 WHEN 'after_close' THEN 3\n  WHEN 'non_trading_day' THEN 4 ELSE 5 END)"
            }
          ]
        },
        {
          "id": 3,
          "type": "table",
          "title": "Past reports",
          "description": "Released reports, newest first, with the share-price move on the first trading day the market could react: released before the open or intraday = that day, after the close or on a non-trading day = the next trading day. A status (for example missing_reaction_bar) replaces the number when the price data is not available. Review: moves above 40% are usually a split or share issue in unadjusted prices.",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 24,
            "h": 14
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "nexus-postgres"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "url"
                },
                "properties": [
                  {
                    "id": "custom.hidden",
                    "value": true
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Headline"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Open the release",
                        "url": "${__data.fields.url}",
                        "targetBlank": true
                      }
                    ]
                  },
                  {
                    "id": "custom.width",
                    "value": 420
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Move %"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "regex",
                        "options": {
                          "pattern": "^[+-]?0\\.[0-4][0-9] %$",
                          "result": {
                            "color": "text",
                            "index": 0
                          }
                        }
                      },
                      {
                        "type": "regex",
                        "options": {
                          "pattern": "^\\+",
                          "result": {
                            "color": "green",
                            "index": 1
                          }
                        }
                      },
                      {
                        "type": "regex",
                        "options": {
                          "pattern": "^-",
                          "result": {
                            "color": "red",
                            "index": 2
                          }
                        }
                      },
                      {
                        "type": "regex",
                        "options": {
                          "pattern": "^[a-z_ ]+$",
                          "result": {
                            "color": "orange",
                            "index": 3
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Review"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "regex",
                        "options": {
                          "pattern": "^.+$",
                          "result": {
                            "color": "orange",
                            "index": 0
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Note"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "regex",
                        "options": {
                          "pattern": "^corrected$",
                          "result": {
                            "color": "blue",
                            "index": 0
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "options": {
            "sortBy": [
              {
                "displayName": "Released (Stockholm)",
                "desc": true
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "nexus-postgres"
              },
              "format": "table",
              "rawSql": "-- Released reports, newest first. The reaction comes from the columns signal stores on the\n-- same row. When data_status is not 'ok' the status text replaces the number (never 0%).\nSELECT\n  to_char(occurred_at AT TIME ZONE 'Europe/Stockholm', 'YYYY-MM-DD HH24:MI') AS \"Released (Stockholm)\",\n  CASE release_session\n    WHEN 'pre_open' THEN 'pre-open'\n    WHEN 'intraday' THEN 'intraday'\n    WHEN 'after_close' THEN 'after close'\n    WHEN 'non_trading_day' THEN 'non-trading day'\n  END AS \"Session\",\n  to_char(expected_date, 'YYYY-MM-DD') AS \"Expected date\",\n  to_char(reaction_date, 'YYYY-MM-DD') AS \"Reaction date\",\n  CASE WHEN data_status = 'ok'\n       THEN rtrim(rtrim(base_close::text, '0'), '.') || ' \u2192 ' || rtrim(rtrim(reaction_close::text, '0'), '.')\n  END AS \"Base \u2192 reaction close\",\n  CASE\n    WHEN data_status = 'ok' THEN\n      CASE WHEN move_pct > 0 THEN '+' ELSE '' END || to_char(move_pct, 'FM990.00') || ' %'\n    ELSE COALESCE(data_status, 'not computed')\n  END AS \"Move %\",\n  CASE WHEN needs_review THEN '\u26a0 check for split / share issue' END AS \"Review\",\n  CASE WHEN superseded_by IS NOT NULL THEN 'corrected' END AS \"Note\",\n  description AS \"Headline\",\n  url\nFROM special_events\nWHERE source = 'mfn' AND event_type IN ('quarterly_report', 'annual_report') AND status = 'occurred' AND NOT is_correction\n  AND ticker = split_part(${company:sqlstring}, '|', 1) AND exchange_mic = split_part(${company:sqlstring}, '|', 2)\nORDER BY occurred_at DESC"
            }
          ]
        },
        {
          "id": 4,
          "type": "barchart",
          "title": "Move per report",
          "description": "Share-price move on the reaction day for each report with price data. Green up, red down, grey within 0.5%.",
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 24,
            "h": 10
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "nexus-postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "text",
                    "value": -0.5
                  },
                  {
                    "color": "green",
                    "value": 0.5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "xField": "Reaction date",
            "colorByField": "Move %",
            "orientation": "vertical",
            "showValue": "auto",
            "xTickLabelRotation": -45,
            "legend": {
              "showLegend": false,
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "nexus-postgres"
              },
              "format": "table",
              "rawSql": "-- Move on the reaction day, oldest to newest. Only reports with a real number.\nSELECT\n  to_char(reaction_date, 'YYYY-MM-DD') AS \"Reaction date\",\n  move_pct AS \"Move %\"\nFROM special_events\nWHERE source = 'mfn' AND event_type IN ('quarterly_report', 'annual_report') AND status = 'occurred' AND NOT is_correction\n  AND ticker = split_part(${company:sqlstring}, '|', 1) AND exchange_mic = split_part(${company:sqlstring}, '|', 2)\n  AND data_status = 'ok'\nORDER BY reaction_date"
            }
          ]
        }
      ]
    }
