apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-nordic-reports
  namespace: nexus
  annotations:
    # Folder in Grafana (sidecar folderAnnotation, see values.yaml).
    grafana_folder: Nexus
  labels:
    grafana_dashboard: "1"
data:
  nordic-reports.json: |
    {
      "uid": "nexus-nordic-reports",
      "title": "Nordic Reports",
      "tags": [
        "nexus",
        "nordic"
      ],
      "timezone": "browser",
      "time": {
        "from": "now-10y",
        "to": "now+1y"
      },
      "refresh": "5m",
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "name": "company",
            "label": "Company",
            "type": "query",
            "datasource": {
              "type": "grafana-postgresql-datasource",
              "uid": "nexus-postgres"
            },
            "query": "-- One option per company that has Nordic reports. The text is the company's display name\n-- (already \"Name (TICKER)\" in the registry); the value is \"TICKER|MIC\".\nSELECT\n  CASE\n    WHEN n.name IS NULL THEN n.ticker\n    WHEN replace(replace(n.name, ' ', ''), '-', '') LIKE '%(' || replace(replace(n.ticker, ' ', ''), '-', '') || ')' THEN n.name\n    ELSE n.name || ' (' || n.ticker || ')'\n  END AS __text,\n  n.ticker || '|' || n.exchange_mic AS __value\nFROM (\n  SELECT ticker, exchange_mic, max(company_name) AS name\n  FROM special_events\n  WHERE source IN ('mfn', 'mfn_release')\n  GROUP BY ticker, exchange_mic\n) n\nORDER BY 1",
            "definition": "-- One option per company that has Nordic reports. The text is the company's display name\n-- (already \"Name (TICKER)\" in the registry); the value is \"TICKER|MIC\".\nSELECT\n  CASE\n    WHEN n.name IS NULL THEN n.ticker\n    WHEN replace(replace(n.name, ' ', ''), '-', '') LIKE '%(' || replace(replace(n.ticker, ' ', ''), '-', '') || ')' THEN n.name\n    ELSE n.name || ' (' || n.ticker || ')'\n  END AS __text,\n  n.ticker || '|' || n.exchange_mic AS __value\nFROM (\n  SELECT ticker, exchange_mic, max(company_name) AS name\n  FROM special_events\n  WHERE source IN ('mfn', 'mfn_release')\n  GROUP BY ticker, exchange_mic\n) n\nORDER BY 1",
            "refresh": 1,
            "sort": 0,
            "multi": false,
            "includeAll": false,
            "hide": 0,
            "current": {},
            "options": [],
            "regex": ""
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "table",
          "title": "Upcoming reports",
          "description": "Scheduled report dates from the company's MFN financial calendar, soonest first. The date is as MFN lists it. The time is MFN's estimate (the previous report's time, which MFN lists in Stockholm time) shown in your own time zone; \"not announced\" when MFN lists none.",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 14,
            "h": 8
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "nexus-postgres"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Est. time"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "time: HH:mm"
                  },
                  {
                    "id": "noValue",
                    "value": "not announced"
                  }
                ]
              }
            ]
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "nexus-postgres"
              },
              "format": "table",
              "rawSql": "-- Scheduled reports from today (exchange-local date) on. expected_time is MFN's estimate (Stockholm\n-- local); occurred_at already holds that instant, so it is returned as a timestamptz and Grafana shows it in\n-- the viewer's time zone. When MFN shows no time the cell is NULL and the column's noValue says\n-- \"not announced\" instead of 00:00. The Date column and the from-today filter stay exchange-local.\nWITH up AS (\n  SELECT\n    to_char(expected_date, 'YYYY-MM-DD') AS \"Date\",\n    CASE WHEN expected_time IS NOT NULL THEN occurred_at END AS \"Est. time\",\n    calendar_label AS \"Report\",\n    report_kind AS \"Kind\",\n    fiscal_period AS \"Fiscal period\"\n  FROM special_events\n  WHERE source IN ('mfn', 'mfn_release') AND superseded_by IS NULL AND event_type IN ('quarterly_report', 'annual_report') AND status = 'scheduled'\n    AND ticker = split_part(${company:sqlstring}, '|', 1) AND exchange_mic = split_part(${company:sqlstring}, '|', 2)\n    AND expected_date >= (now() AT TIME ZONE COALESCE((SELECT timezone FROM exchanges WHERE mic = exchange_mic), 'UTC'))::date\n)\nSELECT * FROM up\nUNION ALL\nSELECT 'No upcoming report dates published', NULL, NULL, NULL, NULL\nWHERE NOT EXISTS (SELECT 1 FROM up)\nORDER BY 1, 2"
            }
          ]
        },
        {
          "id": 2,
          "type": "table",
          "title": "Release timing",
          "description": "When the company's past reports came out relative to the trading session of the company's exchange, not your clock. The hours and time zone come from the exchanges table, so a newly added country needs no dashboard change. All in the exchange's local time: Stockholm 09:00-17:30 (13:00 on half days), Copenhagen 09:00-17:00, Helsinki 10:00-18:30. Pre-open: released before the open. Intraday: released during the session. After close: released after the close. Non-trading day: released on a weekend or holiday. No trading calendar: the holiday table does not cover that year, or the exchange is missing from the exchanges table. Not computed yet: signal has not processed the report yet. Not classified: any other report without a session.",
          "gridPos": {
            "x": 14,
            "y": 0,
            "w": 10,
            "h": 8
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "nexus-postgres"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "nexus-postgres"
              },
              "format": "table",
              "rawSql": "-- How the company's past reports were timed relative to the exchange's local session. A report\n-- without a session gets the reason: no trading calendar (data_status calendar_unknown), not computed\n-- yet (no reaction computed), otherwise not classified.\nSELECT \"Session\", count(*) AS \"Reports\"\nFROM (\n  SELECT\n    CASE\n      WHEN release_session = 'pre_open' THEN 'pre-open'\n      WHEN release_session = 'intraday' THEN 'intraday'\n      WHEN release_session = 'after_close' THEN 'after close'\n      WHEN release_session = 'non_trading_day' THEN 'non-trading day'\n      WHEN data_status = 'calendar_unknown' THEN 'no trading calendar'\n      WHEN data_status IS NULL THEN 'not computed yet'\n      ELSE 'not classified'\n    END AS \"Session\",\n    CASE\n      WHEN release_session = 'pre_open' THEN 1\n      WHEN release_session = 'intraday' THEN 2\n      WHEN release_session = 'after_close' THEN 3\n      WHEN release_session = 'non_trading_day' THEN 4\n      WHEN data_status = 'calendar_unknown' THEN 5\n      WHEN data_status IS NULL THEN 6\n      ELSE 7\n    END AS ord\n  FROM special_events\n  WHERE source = 'mfn' AND event_type IN ('quarterly_report', 'annual_report') AND status = 'occurred' AND NOT is_correction\n    AND ticker = split_part(${company:sqlstring}, '|', 1) AND exchange_mic = split_part(${company:sqlstring}, '|', 2)\n) s\nGROUP BY \"Session\", ord\nORDER BY ord"
            }
          ]
        },
        {
          "id": 3,
          "type": "table",
          "title": "Past reports",
          "description": "Released reports, newest first, with the share-price move on the first trading day the market could react: released before the open or intraday = that day, after the close or on a non-trading day = the next trading day. A status (for example missing_reaction_bar) replaces the number when the price data is not available. Review: moves above 40% are usually a split or share issue in unadjusted prices.",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 24,
            "h": 14
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "nexus-postgres"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Released"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "time: YYYY-MM-DD HH:mm"
                  },
                  {
                    "id": "description",
                    "value": "The release instant, shown in your own time zone (the dashboard follows the browser)."
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Session"
                },
                "properties": [
                  {
                    "id": "description",
                    "value": "Relative to the trading hours of the company's exchange, not your clock. Example: a Helsinki report at 09:00 CET is at the Helsinki open (10:00 local), so it is intraday, not pre-open. No trading calendar: the holiday table does not cover that year, or the exchange is unknown. Not computed yet: signal has not processed the report yet. Not classified: any other report without a session."
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "url"
                },
                "properties": [
                  {
                    "id": "custom.hidden",
                    "value": true
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Headline"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Open the release",
                        "url": "${__data.fields.url}",
                        "targetBlank": true
                      }
                    ]
                  },
                  {
                    "id": "custom.width",
                    "value": 420
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Move %"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": { "mode": "fixed", "fixedColor": "text" }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "regex",
                        "options": {
                          "pattern": "/^[+-]?0\\.[0-4][0-9] %$/",
                          "result": {
                            "color": "text",
                            "index": 0
                          }
                        }
                      },
                      {
                        "type": "regex",
                        "options": {
                          "pattern": "/^\\+/",
                          "result": {
                            "color": "green",
                            "index": 1
                          }
                        }
                      },
                      {
                        "type": "regex",
                        "options": {
                          "pattern": "/^-/",
                          "result": {
                            "color": "red",
                            "index": 2
                          }
                        }
                      },
                      {
                        "type": "regex",
                        "options": {
                          "pattern": "/^[a-z_ ]+$/",
                          "result": {
                            "color": "orange",
                            "index": 3
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Review"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "regex",
                        "options": {
                          "pattern": "/^.+$/",
                          "result": {
                            "color": "orange",
                            "index": 0
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Note"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "regex",
                        "options": {
                          "pattern": "/^corrected$/",
                          "result": {
                            "color": "blue",
                            "index": 0
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "options": {
            "sortBy": [
              {
                "displayName": "Released",
                "desc": true
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "nexus-postgres"
              },
              "format": "table",
              "rawSql": "-- Released reports, newest first. The reaction comes from the columns signal stores on the\n-- same row. When data_status is not 'ok' the status text replaces the number (never 0%). Released is a\n-- timestamptz so Grafana shows it in the viewer's time zone. The price currency is the reaction bar's,\n-- else the exchange's.\nSELECT\n  e.occurred_at AS \"Released\",\n  CASE\n    WHEN e.release_session = 'pre_open' THEN 'pre-open'\n    WHEN e.release_session = 'intraday' THEN 'intraday'\n    WHEN e.release_session = 'after_close' THEN 'after close'\n    WHEN e.release_session = 'non_trading_day' THEN 'non-trading day'\n    WHEN e.data_status = 'calendar_unknown' THEN 'no trading calendar'\n    WHEN e.data_status IS NULL THEN 'not computed yet'\n    ELSE 'not classified'\n  END AS \"Session\",\n  to_char(e.expected_date, 'YYYY-MM-DD') AS \"Expected date\",\n  to_char(e.reaction_date, 'YYYY-MM-DD') AS \"Reaction date\",\n  CASE WHEN e.data_status = 'ok'\n       THEN rtrim(rtrim(e.base_close::text, '0'), '.') || ' \u2192 ' || rtrim(rtrim(e.reaction_close::text, '0'), '.') || COALESCE(' ' || COALESCE(c.currency, x.currency), '')\n  END AS \"Base \u2192 reaction close\",\n  CASE\n    WHEN e.data_status = 'ok' THEN\n      CASE WHEN e.move_pct > 0 THEN '+' ELSE '' END || to_char(e.move_pct, 'FM990.00') || ' %'\n    ELSE COALESCE(e.data_status, 'not computed')\n  END AS \"Move %\",\n  CASE WHEN e.needs_review THEN '\u26a0 check for split / share issue' END AS \"Review\",\n  CASE WHEN e.superseded_by IS NOT NULL THEN 'corrected' END AS \"Note\",\n  e.description AS \"Headline\",\n  e.url\nFROM special_events e\nLEFT JOIN LATERAL (\n  SELECT b.currency FROM daily_bars b\n  WHERE b.ticker = e.ticker AND b.exchange_mic = e.exchange_mic AND b.date = e.reaction_date\n) c ON true\nLEFT JOIN exchanges x ON x.mic = e.exchange_mic\nWHERE e.source = 'mfn' AND e.event_type IN ('quarterly_report', 'annual_report') AND e.status = 'occurred' AND NOT e.is_correction\n  AND e.ticker = split_part(${company:sqlstring}, '|', 1) AND e.exchange_mic = split_part(${company:sqlstring}, '|', 2)\nORDER BY e.occurred_at DESC"
            }
          ]
        },
        {
          "id": 4,
          "type": "barchart",
          "title": "Move per report",
          "description": "Share-price move on the reaction day for each report with price data. Green up, red down, grey within 0.5%.",
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 24,
            "h": 10
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "nexus-postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "text",
                    "value": -0.5
                  },
                  {
                    "color": "green",
                    "value": 0.5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "xField": "Reaction date",
            "colorByField": "Move %",
            "orientation": "vertical",
            "showValue": "auto",
            "xTickLabelRotation": -45,
            "legend": {
              "showLegend": false,
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "nexus-postgres"
              },
              "format": "table",
              "rawSql": "-- Move on the reaction day, oldest to newest. Only reports with a real number.\nSELECT\n  to_char(reaction_date, 'YYYY-MM-DD') AS \"Reaction date\",\n  move_pct AS \"Move %\"\nFROM special_events\nWHERE source = 'mfn' AND event_type IN ('quarterly_report', 'annual_report') AND status = 'occurred' AND NOT is_correction\n  AND ticker = split_part(${company:sqlstring}, '|', 1) AND exchange_mic = split_part(${company:sqlstring}, '|', 2)\n  AND data_status = 'ok'\nORDER BY reaction_date"
            }
          ]
        }
      ]
    }
