apiVersion: v2
name: alloy
description: >-
  Umbrella chart for Grafana Alloy as a DaemonSet that ships every pod's logs
  to Loki, and receives OTLP traces and forwards them to Tempo. See
  docs/guides/loki.md and docs/guides/tracing.md.
type: application
version: 0.1.0
appVersion: "v1.21.2"
dependencies:
  - name: alloy
    version: "1.14.3"
    repository: https://grafana.github.io/helm-charts
