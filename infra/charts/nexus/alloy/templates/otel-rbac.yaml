# Extra read-only access for otelcol.processor.k8sattributes: the deployment name
# is resolved through the pod's ReplicaSet owner, and the node through nodes. The
# alloy chart's own ClusterRole covers pods and namespaces only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-k8sattributes
rules:
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-k8sattributes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-k8sattributes
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: nexus
