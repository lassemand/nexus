# ExternalSecret — pulls the Backblaze B2 application key for the Tempo bucket
# from Vault (secret/nexus/tempo). The resulting secret is injected into the
# Tempo pod as environment variables (singleBinary.extraEnvFrom) and expanded in
# the Tempo config through -config.expand-env=true, so no key is ever rendered
# into a ConfigMap.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tempo-s3
  namespace: nexus
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: nexus-secret-store
    kind: ClusterSecretStore
  target:
    name: tempo-s3
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: nexus/tempo
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: nexus/tempo
        property: AWS_SECRET_ACCESS_KEY
