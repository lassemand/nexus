apiVersion: v1
kind: ServiceAccount
metadata:
  name: analyst
  labels:
    app: analyst
---
# Namespace-scoped only: the analyst starts and watches its own preparation Jobs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: analyst
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: analyst
subjects:
  - kind: ServiceAccount
    name: analyst
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: analyst
