# DATABASE_URL: the analyst's own database (`analyst`, owner nexus).
# SIGNAL_DATABASE_URL: signal's database (`backtest`). No read-only role exists, so this is
# the same role as signal's (nexus); the service opens the connection read-only
# (default_transaction_read_only = on) and only SELECTs. Both live in Vault key nexus/analyst.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: analyst-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: nexus-secret-store
    kind: ClusterSecretStore
  target:
    name: analyst-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: nexus/analyst
        property: DATABASE_URL
    - secretKey: SIGNAL_DATABASE_URL
      remoteRef:
        key: nexus/analyst
        property: SIGNAL_DATABASE_URL
---
# ANTHROPIC_API_KEY for the preparation Jobs only. The user stores it before the first live
# preparation (README.md).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: analyst-prep-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: nexus-secret-store
    kind: ClusterSecretStore
  target:
    name: analyst-prep-secret
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: nexus/analyst-prep
        property: ANTHROPIC_API_KEY
