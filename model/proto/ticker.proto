syntax = "proto3";
package nexus;

// A ticker registration event published to the `company.tickers` Kafka topic.
// Sector is intentionally absent — it is looked up server-side by `signal`.
// Readers replay the topic in order; the last message for a listing
// (ticker, exchange_mic) decides whether it is registered.
message TickerRegistration {
  // Raw ticker symbol as provided by the publisher.
  // Normalisation to uppercase is performed by the consumer, not here.
  string ticker = 1;
  // ISO 10383 Market Identifier Code (MIC) for the exchange this ticker
  // trades on. Empty string means the consumer should fall back to a
  // sensible default (XNAS for US instruments).
  // Added in field 2 — do not renumber field 1.
  string exchange_mic = 2;
  // ISO 4217 currency code for the instrument (e.g. "USD", "SEK").
  // Empty string means the consumer should derive it from exchange_mic.
  // Added in field 3 — do not renumber existing fields.
  string currency = 3;
  // When true, withdraws an earlier registration of (ticker, exchange_mic);
  // currency is ignored. A later registration brings the listing back.
  // Added in field 4 — do not renumber existing fields.
  bool unregister = 4;
  // Source mappings looked up by `nexus register` for Nordic listings. Empty
  // means "not given": a reader keeps what it already has. A later
  // registration with a value replaces an earlier one.
  // Display name, as MFN spells it.
  string name = 5;
  // Slug of the company page on MFN (`https://mfn.se/a/<slug>`).
  string mfn_slug = 6;
  // Issuer name in Finansinspektionen's insider register (Swedish listings).
  string fi_issuer = 7;
}
