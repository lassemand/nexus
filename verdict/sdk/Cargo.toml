[package]
name = "verdict-sdk"
version = "0.0.0"
edition = "2021"
publish = false
description = "SDK that every analyst report kernel is written against."

[dependencies]
aho-corasick = "1.1"
memchr = "2.8"
regex = "1.12"
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
