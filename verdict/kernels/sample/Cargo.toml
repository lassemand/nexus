[package]
name = "verdict-sample"
version = "0.0.0"
edition = "2021"
publish = false
description = "Skeleton kernel: the structure of a kernel with the lookup left to the agent."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
verdict-sdk = { path = "../../sdk" }

[dev-dependencies]
serde_json = "1"
verdict-sdk = { path = "../../sdk", features = ["harness"] }
