$schema: '../../../.moon/cache/schemas/project.json'

tasks:
  wasm:
    description: 'clippy and release build of verdict-sdk and verdict-sample for wasm32'
    script: 'cargo clippy -p verdict-sdk -p verdict-sample --target wasm32-unknown-unknown -- -D warnings && cargo build --release --target wasm32-unknown-unknown -p verdict-sample'
    inputs:
      - '/verdict/sdk/**/*'
      - '/verdict/kernels/**/*'
      - 'group://globals'
    env:
      CARGO_TARGET_DIR: '$workspaceRoot/target'
    options:
      cache: false
