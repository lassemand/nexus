[package]
name = "analyst"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "analyst"
path = "src/lib.rs"

[[bin]]
name = "analyst"
path = "src/bin/analyst.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
chrono-tz = "0.10"
humantime = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "migrate", "macros", "rust_decimal"] }
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
metrics = "0.24"
model = { path = "../model", features = ["postgres"] }
prost = "0.13"
rdkafka = { version = "0.36", features = ["cmake-build", "tokio"] }
uuid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
telemetry = { path = "../telemetry", features = ["kafka"] }
hex = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
verdict-sdk = { path = "../verdict/sdk" }
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std"] }

[dev-dependencies]
telemetry = { path = "../telemetry", features = ["kafka", "testing"] }
tokio = { version = "1", features = ["test-util"] }
wat = "1"
wiremock = "0.6"
verdict-sdk = { path = "../verdict/sdk", features = ["harness"] }
