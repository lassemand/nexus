[package]
name = "analyst"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "analyst"
path = "src/lib.rs"

[[bin]]
name = "analyst"
path = "src/bin/analyst.rs"

[[bin]]
name = "analyst-bench"
path = "src/bin/analyst-bench.rs"
required-features = ["bench"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
chrono-tz = "0.10"
humantime = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
metrics = "0.24"
model = { path = "../model" }
prost = "0.13"
rdkafka = { version = "0.36", features = ["cmake-build", "tokio"] }
uuid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
telemetry = { path = "../telemetry", features = ["kafka"] }
hex = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1"
verdict-sdk = { path = "../verdict/sdk" }
verdict-bench-anchored = { path = "../verdict/kernels/bench-anchored", optional = true }
verdict-bench-memmem = { path = "../verdict/kernels/bench-memmem", optional = true }
verdict-bench-aho = { path = "../verdict/kernels/bench-aho", optional = true }
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std"] }

[features]
bench = ["dep:verdict-bench-anchored", "dep:verdict-bench-memmem", "dep:verdict-bench-aho"]

[dev-dependencies]
telemetry = { path = "../telemetry", features = ["kafka", "testing"] }
tokio = { version = "1", features = ["test-util"] }
wat = "1"
verdict-sdk = { path = "../verdict/sdk", features = ["harness"] }
verdict-bench-anchored = { path = "../verdict/kernels/bench-anchored" }
verdict-bench-memmem = { path = "../verdict/kernels/bench-memmem" }
verdict-bench-aho = { path = "../verdict/kernels/bench-aho" }
