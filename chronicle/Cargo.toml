[package]
name = "chronicle"
version.workspace = true
edition = "2021"

# Shared library for the Nordic report binaries (`nordic-reports`, `nordic-calendar`).
# Named differently from the `chronicle` binary to avoid an output-name collision.
[lib]
name = "chronicle_lib"
path = "src/lib.rs"

[[bin]]
name = "chronicle"
path = "src/main.rs"

[[bin]]
name = "market"
path = "src/market.rs"

[[bin]]
name = "earnings"
path = "src/earnings_bin.rs"

[[bin]]
name = "filings"
path = "src/filings.rs"

[[bin]]
name = "pdmr"
path = "src/pdmr.rs"

[[bin]]
name = "nordic-reports"
path = "src/nordic_reports.rs"

[[bin]]
name = "nordic-live"
path = "src/nordic_live.rs"

[[bin]]
name = "nordic-calendar"
path = "src/nordic_calendar.rs"

[[bin]]
name = "saxo_stream"
path = "src/saxo_stream.rs"

[dependencies]
model = { path = "../model" }
alpha = { path = "../alpha" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdkafka = { version = "0.36", features = ["cmake-build", "tokio"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid"] }
chrono = "0.4"
chrono-tz = "0.10"
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
prost = "0.13"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
quick-xml = { version = "0.37", features = ["serialize"] }
anyhow = "1"
urlencoding = "2"
async-trait = "0.1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
scraper = "0.29.0"
uuid = { version = "1.29.0", features = ["serde"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

[dev-dependencies]
# In-process mock HTTP server for the PR smoke test (chronicle/tests/smoke_test.rs) —
# stubs FI's public API and Nager.Date so the check logic can be exercised
# deterministically without depending on the real internet endpoints.
wiremock = "0.6"
