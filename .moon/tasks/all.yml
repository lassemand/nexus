$schema: '../cache/schemas/tasks.json'

# Files whose change runs every Rust task.
fileGroups:
  globals:
    - '/Cargo.toml'
    - '/Cargo.lock'
    - '/rust-toolchain.toml'
    - '/.cargo/**/*'
    - '/.moon/**/*'
    - '/.github/workflows/ci.yml'

# A change to the workflow runs every task, Rust or not: its jobs install what
# the tasks need (the isolation job's helper, packages, Docker images).
implicitInputs:
  - '/.github/workflows/ci.yml'
